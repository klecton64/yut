<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증강 윷놀이</title>
<style>
:root{--bg:#14161c;--card:#1e222b;--card2:#272c38;--tx:#e8eaf0;--mut:#8b93a7;--ac:#ffb84d;--bd:#323848}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:15px}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);color:#1a1300;border-color:var(--ac);font-weight:700}
input[type=text]{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;width:100%}
h1{margin:0 0 4px;font-size:28px}
.wrap{max-width:1180px;margin:0 auto;padding:12px}
.center{max-width:420px;margin:8vh auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(300px,640px) 1fr;gap:12px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
svg{width:100%;height:auto;background:#222736;border-radius:12px;display:block}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--bd);font-size:12px;margin:2px 3px 2px 0;cursor:help}
.chip.used{opacity:.4;text-decoration:line-through}
.res{font-size:18px;font-weight:700;padding:8px 14px}
.res.sel{background:var(--ac);color:#1a1300;border-color:var(--ac)}
.cur{outline:2px solid var(--ac)}
.dead{opacity:.45}
.log{height:210px;overflow:auto;font-size:13px;line-height:1.55;color:#c8cddb}
.hint{background:#3a2f12;border:1px solid var(--ac);color:var(--ac);padding:8px 12px;border-radius:8px;margin:8px 0}
.overlay{position:fixed;inset:0;background:rgba(5,6,10,.82);display:flex;align-items:flex-start;justify-content:center;z-index:10;padding:12px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:900px;width:100%;margin:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.opt{text-align:left;padding:14px;background:var(--card2);border-radius:12px;border:2px solid var(--bd);cursor:pointer}
.opt:hover:not(.lock){border-color:var(--ac)}
.opt.lock{opacity:.35;cursor:not-allowed}
.opt b{font-size:17px;display:block;margin-bottom:6px}
.opt .d{font-size:13px;color:#c8cddb;line-height:1.45}
.tag{font-size:11px;color:var(--ac);margin-left:6px}
.augl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:45vh;overflow:auto;margin-top:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#552;border:1px solid var(--ac);padding:10px 18px;border-radius:10px;z-index:30;display:none}
.win{background:linear-gradient(90deg,#4a3500,#1e222b);border-color:var(--ac);font-size:18px}
.homebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hp{width:22px;height:22px;border-radius:50%;border:2px solid #000;display:inline-block;font-size:11px;text-align:center;line-height:18px;font-weight:700;color:#000}
.hp{position:relative;margin:0 3px}.hp .dc{position:absolute;top:-9px;right:-6px;font-size:11px;line-height:1}
.hp.me{cursor:pointer;box-shadow:0 0 0 2px var(--ac)}
.colorbtn{min-width:90px;font-weight:700;color:#111;border:2px solid #000}
.banner{background:#1d2a3a;border:1px solid #3d5a80;color:#bcd;padding:6px 10px;border-radius:8px;margin-bottom:8px;font-size:13px}
ol.final{margin:8px 0 0;padding-left:22px}

#fx2{display:none;position:fixed;inset:0;z-index:85;pointer-events:none}.fxtag{position:fixed;top:14px;left:0;right:0;text-align:center;color:#fff;font-size:22px;font-weight:800;text-shadow:0 2px 8px #000}
body.fxhide g[data-a="piece"]{opacity:0!important}
body.aiming svg[viewBox="0 0 100 100"]{touch-action:none;cursor:crosshair}
#fx{display:none;position:fixed;inset:0;z-index:90;pointer-events:none;align-items:center;justify-content:center;background:rgba(5,6,10,.88)}
.fxbox{text-align:center;perspective:700px}
.fxname{color:#fff;font-size:16px;margin-bottom:18px;text-shadow:0 1px 4px #000}
.fxrow{display:flex;gap:14px;justify-content:center;height:150px;align-items:flex-end;margin-bottom:10px}
.stick{width:22px;height:120px;position:relative;transform-style:preserve-3d}
.sf{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sf.flat{background:linear-gradient(90deg,#f3dca8,#e2bd78);border:2px solid #b98a45}
.sf.flat i{position:absolute;left:3px;right:3px;top:12px;height:10px;border-radius:5px;background:#d33}
.sf.round{background:linear-gradient(90deg,#5a3a1c,#7a5128);border:2px solid #3b2410;transform:rotateX(180deg)}
.ogrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:340px;margin:0 auto}.ocell{width:100px}.oname{font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}.fxrow.small{height:100px;gap:6px}.fxrow.small .stick{width:13px;height:70px}.ores{font-size:26px;font-weight:800;min-height:34px;opacity:0;transition:opacity .25s;text-shadow:0 2px 6px #000}.ores.show{opacity:1}
.fxres{font-size:54px;font-weight:800;min-height:64px;opacity:0;transform:scale(.6);transition:all .25s;text-shadow:0 2px 8px #000}
.fxres.show{opacity:1;transform:scale(1)}
#log div{}.priv{font-size:12px;margin-top:4px;padding:4px 6px;border-radius:6px;background:rgba(255,183,3,.12);border:1px solid rgba(255,183,3,.35)}
#mute{position:fixed;right:10px;bottom:10px;z-index:80;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}

/* 증강팩 화면 · 림버스 팩(지옥 제1원 '림보') 테마 */
.pk-limbus{position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 120%,rgba(255,120,40,.35),transparent 60%),linear-gradient(160deg,#4a0d17 0%,#25060b 60%,#150306 100%)!important;border:2px solid #b3182b!important;box-shadow:inset 0 0 0 1px rgba(232,190,110,.35),0 0 14px rgba(179,24,43,.35)}
.pk-limbus::before{content:"";position:absolute;right:-26px;top:-26px;width:120px;height:120px;opacity:.2;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='none' stroke='%23ffb37a' stroke-width='3'/><circle cx='50' cy='50' r='39' fill='none' stroke='%23ffb37a' stroke-width='1'/><g stroke='%23ffb37a' stroke-width='3' stroke-linecap='round'><path d='M50 8v8M50 84v8M8 50h8M84 50h8'/></g><g stroke='%23ffb37a' stroke-width='1.6'><path d='M71 14l-4 7M86 29l-7 4M86 71l-7-4M71 86l-4-7M29 86l4-7M14 71l7-4M14 29l7 4M29 14l4 7'/></g><path d='M50 50V22M50 50l18 10' stroke='%23ffb37a' stroke-width='3' stroke-linecap='round'/><circle cx='50' cy='50' r='3.5' fill='%23ffb37a'/></svg>") no-repeat center/contain}
.pk-limbus::after{content:"✦ 지옥 제1원 · 림보 ✦";position:absolute;left:0;right:0;bottom:0;padding:2px 0;text-align:center;font-size:10px;letter-spacing:2px;color:rgba(255,205,150,.75);background:linear-gradient(90deg,transparent,rgba(179,24,43,.55),transparent);pointer-events:none}
.opt.pk-limbus{padding-bottom:24px}
.opt.pk-limbus:hover:not(.lock){border-color:#e8be6e!important}
.pk-limbus b{font-family:Georgia,'Nanum Myeongjo','Noto Serif KR',serif;color:#ffe3c2;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.pk-limbus .d{color:#f1cfc4!important}
.pk-limbus .tag{background:rgba(232,190,110,.2);color:#ffd9a0}
.chip.pk-limbus{padding-bottom:2px;border-width:1px!important}.chip.pk-limbus::before,.chip.pk-limbus::after{display:none}
.packbox{width:100%;max-width:560px;margin:0 auto;text-align:left}
.packbtn.pk-limbus{padding-bottom:24px}
.packbtn{display:block;width:100%;text-align:left;margin-top:8px}
.packhead{padding:14px;border-radius:12px;margin-bottom:10px}
.packhead.pk-limbus::after{display:none}
.augrow{padding:10px 12px;margin-top:6px;border-radius:10px;background:var(--card2);border:1px solid var(--bd)}
.augrow.pk-limbus{padding-bottom:10px}.augrow.pk-limbus::after{display:none}.augrow.pk-limbus::before{width:70px;height:70px;right:-14px;top:-14px}
.augrow b{display:block}.augrow .d{font-size:13px;color:#c8cddb;line-height:1.45;margin-top:3px}

/* ---- 능력 버튼 스킨 (컨셉별) ---- */
.ab{position:relative;overflow:hidden;font-weight:800;letter-spacing:.2px;color:var(--tx2,#fff)!important;background:var(--bgi,linear-gradient(135deg,var(--c1,#333),var(--c2,#111)))!important;border:1.5px solid var(--bd2,#888)!important;text-shadow:0 1px 2px rgba(0,0,0,.65);box-shadow:0 0 10px var(--gl,transparent),inset 0 0 8px rgba(255,255,255,.12);transition:transform .12s,box-shadow .2s}
.ab:hover:not(:disabled){transform:translateY(-1px) scale(1.03);box-shadow:0 0 18px var(--gl,#fff6),inset 0 0 10px rgba(255,255,255,.22)}
.ab:disabled{filter:grayscale(.75) brightness(.7);box-shadow:none}
.ab .ic{display:inline-block;margin-right:5px;filter:drop-shadow(0 0 3px var(--gl,#fff8))}
.ab::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:abshine 3.2s infinite}
.ab:disabled::after{display:none}
@keyframes abshine{0%,70%{left:-60%}100%{left:130%}}
.abrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.abgrp{font-size:12px;color:var(--mut);margin:10px 0 2px}

/* ---- 전체화면 연출 ---- */
#fx3{display:none;position:fixed;inset:0;z-index:95;pointer-events:none;overflow:hidden;background:#000}
#fx3 svg.art{position:absolute;inset:0;width:100%;height:100%;background:transparent!important;border-radius:0!important}
#fx3 .ttl{position:absolute;left:0;right:0;bottom:14%;text-align:center;color:#fff;text-shadow:0 0 18px var(--tg,#fff),0 3px 10px #000;animation:ttlin 3s ease-out both}
#fx3 .ttl small{display:block;font-size:clamp(12px,2.4vw,20px);letter-spacing:6px;opacity:.85;margin-bottom:6px}
#fx3 .ttl b{display:block;font-size:clamp(30px,8vw,76px);font-weight:900;letter-spacing:3px;font-family:Georgia,'Nanum Myeongjo','Noto Serif KR',serif}
#fx3 .ttl i{display:block;font-style:normal;font-size:clamp(12px,2.2vw,18px);opacity:.8;margin-top:8px}
#fx3.show{display:block;animation:fx3in 3.2s ease-in-out both}
@keyframes fx3in{0%{opacity:0}9%{opacity:1}86%{opacity:1}100%{opacity:0}}
@keyframes ttlin{0%,12%{opacity:0;transform:scale(1.25);filter:blur(8px)}30%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:1}}
#fx3 .shake{animation:shk .12s infinite}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-.8px,.6px)}50%{transform:translate(.8px,-.6px)}75%{transform:translate(-.6px,-.8px)}100%{transform:translate(0,0)}}
.k-open{transform-box:fill-box;transform-origin:center;animation:kopen 1.1s .15s cubic-bezier(.2,.9,.3,1) both}
@keyframes kopen{0%{transform:scaleY(.02)}100%{transform:scaleY(1)}}
.k-pulse{transform-box:fill-box;transform-origin:center;animation:kpulse 1.4s ease-in-out infinite}
@keyframes kpulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}}
.k-fall{animation:kfall 2.6s linear infinite}
@keyframes kfall{0%{transform:translateY(-30px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(120px) rotate(300deg);opacity:0}}
.k-rise{animation:krise 3s linear infinite}
@keyframes krise{0%{transform:translateY(20px);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
.k-draw{stroke-dasharray:var(--len,400);stroke-dashoffset:var(--len,400);animation:kdraw 1.4s ease-out forwards}
@keyframes kdraw{to{stroke-dashoffset:0}}
.k-flash{animation:kflash .5s ease-out both}
@keyframes kflash{0%{opacity:1}100%{opacity:0}}
.k-blink{animation:kblink .9s steps(2) infinite}
@keyframes kblink{0%{opacity:0}50%{opacity:1}}
.k-spin{transform-box:fill-box;transform-origin:center;animation:kspin 6s linear infinite}
@keyframes kspin{to{transform:rotate(360deg)}}
.k-harp{animation:kharp 1.25s cubic-bezier(.1,.7,.2,1) both}
@keyframes kharp{0%{transform:translate(-120px,40px)}100%{transform:translate(0,0)}}
.k-wave{animation:kwave 3.2s ease-in-out both}
@keyframes kwave{0%{transform:translateY(110px)}100%{transform:translateY(0)}}
.k-sway{animation:ksway 2.4s ease-in-out infinite alternate}
@keyframes ksway{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
.k-whale{animation:kwhale 3s ease-in-out both}
@keyframes kwhale{0%{transform:translate(-60px,20px) rotate(-12deg)}100%{transform:translate(130px,-10px) rotate(8deg)}}
.k-ring{transform-box:fill-box;transform-origin:center;animation:kring 1.6s ease-out infinite}
@keyframes kring{0%{transform:scale(.1);opacity:1}100%{transform:scale(2.6);opacity:0}}
.k-tower{animation:ktower 2.6s ease-in both;transform-origin:50% 100%;transform-box:fill-box}
@keyframes ktower{0%,40%{transform:rotate(0)}100%{transform:rotate(7deg) translateY(10px);opacity:.6}}
.k-bolt{animation:kbolt 1.1s steps(1) infinite}
@keyframes kbolt{0%{opacity:0}8%{opacity:1}14%{opacity:0}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
.k-flame{transform-box:fill-box;transform-origin:50% 100%;animation:kflame .7s ease-in-out infinite alternate}
@keyframes kflame{from{transform:scaleY(.8) skewX(-4deg)}to{transform:scaleY(1.15) skewX(4deg)}}
.k-egg{transform-box:fill-box;transform-origin:50% 100%;animation:kegg 1.4s ease-in-out both}
@keyframes kegg{0%{transform:rotate(0)}15%{transform:rotate(-5deg)}30%{transform:rotate(5deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(7deg)}100%{transform:rotate(0) scale(1.1)}}
.k-burst{transform-box:fill-box;transform-origin:center;animation:kburst 1.6s .9s ease-out both}
@keyframes kburst{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:scale(3);opacity:0}}
/* 보드 위 효과 */
#fx4{display:none;position:fixed;inset:0;z-index:84;pointer-events:none}
#fx4 svg{position:fixed;background:transparent!important;border:0!important;border-radius:0!important}
.bfx-ring{transform-box:fill-box;transform-origin:center;animation:bring 1s ease-out forwards}
@keyframes bring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
.bfx-line{stroke-dasharray:var(--len,150);stroke-dashoffset:var(--len,150);animation:kdraw .45s ease-out forwards,bfade .5s .5s forwards}
@keyframes bfade{to{opacity:0}}
.bfx-pop{transform-box:fill-box;transform-origin:center;animation:bpop 1.1s ease-out forwards}
@keyframes bpop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:scale(1) translateY(-4px);opacity:0}}
.bfx-lbl{position:fixed;top:64px;left:0;right:0;text-align:center;font-size:clamp(16px,3.2vw,26px);font-weight:800;color:#fff;text-shadow:0 2px 10px #000,0 0 14px var(--tg,#fff);animation:lblin 1.7s ease-out forwards}
@keyframes lblin{0%{opacity:0;transform:translateY(-10px) scale(.9)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* 보드 위 고래·빛·균열 */
.wh{animation:whbob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes whbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-1.2px) rotate(4deg)}}
.lt{animation:ltpulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ltpulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.pc-tw{animation:pctw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pctw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}


/* v1.12 */
#fabs{position:fixed;left:10px;bottom:10px;z-index:130;display:none;gap:6px}
#fabs button{padding:7px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:rgba(20,22,28,.85);color:#fff;font-size:13px;cursor:pointer}
#fabs button.arm{background:#b3182b;border-color:#ff8a8a}
.pkm{position:fixed;inset:0;z-index:125;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:12px}
.pkbox{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.cf{position:fixed;top:-16px;width:9px;height:14px;z-index:140;pointer-events:none;animation:cff 2.6s linear forwards}
@keyframes cff{to{transform:translateY(112vh) rotate(900deg)}}
.stk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.stk>div{flex:1 1 70px;min-width:70px;padding:6px 7px;border-radius:9px;background:var(--card2);border:1px solid var(--bd);font-size:12px}
.stk>div.mine{border-color:#ffd23f;box-shadow:0 0 0 1px #ffd23f inset}
.stk b{font-size:15px}.stk .up{color:#ff6b6b}.stk .dn{color:#6bb5ff}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="fx"></div>
<div id="fx2"></div>
<div id="fx3"></div>
<div id="fx4"></div>
<button id="mute" onclick="toggleMute()" title="효과음"></button>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const VERSION = 'v1.13 (뒤틀림 재판정 · 뒤틀림 개편 · 주식 시장 · 묘비 · 골인 팡파르 · 나가기 수정 · 2026-11-09)';
const RES = ['백도', '도', '개', '걸', '윷', '모'];
const COLORS = ['#e5484d', '#3e8ef7', '#30a46c', '#f5c518', '#a855f7', '#f97316'], COLOR_NAMES = ['빨강', '파랑', '초록', '노랑', '보라', '주황'];
const LET = { lord: '군', lucio: '루', valen: '발', hunt: '헌', vanguard: '선', zealot: '광', marathon: '마', goblin: '깨', cannon: '포', pawn: '폰', kim: '김', queen: '후' };
let ws, meta = null, S = null, ui = { ri: 0, mode: null, abil: null, pid: null };
let token = localStorage.getItem('yut_token');
if (!token) { token = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('yut_token', token); }
const AUG = () => Object.fromEntries((meta ? meta.augments : []).map((a) => [a.id, a]));
const resetUI = () => { ui.mode = null; ui.abil = null; ui.pid = null; ui.extra = null; ui.mv = null; };

function connect(first) {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => {
    const room = localStorage.getItem('yut_room');
    if (first && room) ws.send(JSON.stringify({ t: 'join', code: room, name: localStorage.getItem('yut_name') || '', token }));
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'joined') { meta = m.meta; localStorage.setItem('yut_room', m.code); }
    else if (m.t === 'state') enqueueState(m.s);
    else if (m.t === 'left') { fxQ.length = 0; lastSeq = null; lastFlickSeq = null; lastFxSeq = null; S = null; meta = null; resetUI(); localStorage.removeItem('yut_room'); render(); }
    else if (m.t === 'err') { toast(m.msg); if (!S) { localStorage.removeItem('yut_room'); render(); } }
  };
  ws.onclose = () => { if (S) toast('연결이 끊어졌습니다. 새로고침하면 다시 들어갑니다'); };

  ['harpoon', 'ego', 'trait', 'weapon', 'stockswap'].forEach((k) => { if (ABIL[k].show(me)) ab.push(k); });
  if (ab.length) {
    h += '<div class="abrow">' + ab.map((id) => {

      if (d.can && !d.can(me)) off = true;
      const label = extra ? d.name(me) : (id === 'yakji' ? (me.st.lim.art ? '폐장' : '예술!') : A[id].name);
      const sk = extra ? d.skin(me) : id;
      const desc = extra ? label : A[id].desc;
      return `<button class="ab" style="${skinStyle(sk)}" data-a="abil" data-v="${id}" ${off ? 'disabled' : ''} title="${esc(desc)}"><span class="ic">${skinIcon(sk)}</span>${esc(label)}</button>`;
    }).join('') + '</div>';
  }
  if (ui.mode) {
    const others = S.players.filter((p) => p.alive && !p.out && p.idx !== S.me);
    let extra = '';
    if (ui.mode === 'sel_player') extra = others.map((p) => `<button data-a="abil_t" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('');
    if (ui.mode === 'sel_dead') extra = S.players.filter((p) => !p.alive).map((p) => `<button data-a="abil_t" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('') || '<span class="mut">탈락한 플레이어가 없습니다</span>';
    if (ui.mode === 'sel_side') extra = ['R', 'L', 'T', 'B'].map((sd) => `<button data-a="side" data-v="${sd}">${{ R: '오른쪽', L: '왼쪽', T: '위쪽', B: '아래쪽' }[sd]} 면 속박</button>`).join('');
    if (ui.mode === 'sel_d') extra = '<button data-a="dir" data-v="1">도 (앞으로 1칸)</button><button data-a="dir" data-v="-1">백도 (뒤로 1칸)</button>';
    if (ui.abil === 'timetravel' && ui.mode === 'sel_n') extra = '<button data-a="tthome">대기칸으로</button>';
    if (ui.mode === 'sel_tm') extra = `<button class="ab" style="${skinStyle('yellow_dash')}" data-a="tmode" data-v="dash"><span class="ic">🔱</span>3칸 돌진</button><button class="ab" style="${skinStyle('yellow_drag')}" data-a="tmode" data-v="drag"><span class="ic">⚓</span>작살로 끌어오기</button>`;
    if (ui.mode === 'sel_stock') extra = ['W', 'L', 'T', 'H'].filter((k) => !(me.st.lim.stock && me.st.lim.stock.name === k)).map((k) => `<button class="ab" style="${skinStyle('stock')}" data-a="stockto" data-v="${k}"><span class="ic">📈</span>${k}사 (${S.stocks ? S.stocks[k].v : '-'})</button>`).join('');
    if (ui.mode === 'sel_wd') extra = '<button data-a="wdir" data-v="f">앞으로</button><button data-a="wdir" data-v="b">뒤로</button>';
    if (ui.mode === 'sel_mv' && ui.mv) {
      const mv = ui.mv; extra = '<button class="pri" data-a="mvgo" data-v="">앞으로 (기본)</button>';
      if (mv.any) extra += Array.from({ length: mv.st }, (_, i) => `<button data-a="mvgo" data-v="d${i + 1}">${i + 1}칸</button>`).join('');
      if (mv.back) extra += `<button data-a="mvgo" data-v="back">⏪ 뒤로 ${mv.st - 2}칸</button>`;
    }
    h += `<div class="hint">${ui.mode === 'sel_mv' ? '이동 방식을 고르세요 (어느 싱클레어: 던진 결과 이내에서 원하는 칸수 · 5급 해결사: 뒤로 이동 가능)' : abilHint()} <button data-a="cancel">취소</button> ${extra}</div>`;
  }
  return h;
}

function privInfo(p) {
  if (p.idx !== S.me || !p.st.lim) return '';
  const lm = p.st.lim; let o = '';
  if (lm.quest) o += `<div class="priv">🔎 <b>지령</b>: ${esc(lm.quest.text)}${lm.quest.progress ? ` <span class="mut">(${esc(lm.quest.progress)})</span>` : ''}</div>`;
  if (lm.lake != null && meta.rules) o += `<div class="priv">🌊 <b>내가 정한 규칙</b>: ${esc(meta.rules[lm.lake])}</div>`;
  if (lm.knows && lm.knows.length) o += lm.knows.map((k) => `<div class="priv">🌊 알게 된 규칙(${esc(S.players[k.by].name)}): ${esc(k.text)}</div>`).join('');
  return o;
}
function playerCards() {
  const A = AUG();
  return S.players.map((p) => {
    const home = p.pieces.filter((x) => !x.done && x.pos === 0);
    const badges = [];
    if (p.st.coins) badges.push(`🐶${p.st.coins}`);
    if (p.augs.includes('summon')) badges.push(`🔮${p.st.ritual}/12`);
    if (p.augs.includes('garlic')) badges.push(`🧄${p.st.garlicGot.length}/3`);
    if (p.augs.includes('coup')) badges.push(`⚔${p.st.kills}/4`);
    if (p.augs.includes('cow')) badges.push(`🐂${p.st.backdoCaps}/2`);
    if (p.augs.includes('score')) badges.push(`🎼${p.st.seen.length}/6`);
    if (p.augs.includes('nofriend')) badges.push(`🥲${p.st.friendHits.length}/${S.players.filter((q) => q.alive).length - 1}`);
    if (p.augs.includes('queen')) badges.push(`👑목숨+${p.st.queenLives} · 던짐 ${p.st.queenThrows}/12`);
    if (p.augs.includes('kim') && p.st.kimLeft > 0) badges.push(`🎎${p.st.kimLeft}차례 남음`);
    if (p.st.domain) badges.push(`🌀영역 ${p.st.domain.left}`);
    const lm = p.st.lim || {};
    if (p.augs.includes('lamancha')) badges.push(`🩸피 ${lm.blood || 0}`);
    if (p.augs.includes('ksa')) badges.push(`💉앰플 ${lm.amp || 0}${lm.graves && lm.graves.length ? ' · 🪦' + lm.graves.length : ''}`);
    if (p.augs.includes('hunt')) badges.push(`⚰관 ${lm.coffin || 0}${lm.timers ? ' · 부활 중 ' + lm.timers : ''}`);
    if (p.augs.includes('lord')) badges.push(`🐺흑수의 주인 ${lm.lordMark || 0}/2`);
    if (p.augs.includes('yakji')) badges.push(`🧬${lm.bio || 0}/4${lm.art ? ' · 🎨예술 완성' : ''}`);
    if (p.augs.includes('tsa') && p.st.bank) badges.push(`⏳보관 윷 ${p.st.bank}`);
    if (p.augs.includes('geomji')) badges.push(`🔎지령 ${lm.qdone || 0}/3`);
    if (p.augs.includes('stock') && lm.stock) badges.push(`📈${esc(lm.stock.name)}사 ${lm.stock.v}`);
    const ahb = p.pieces.find((x) => x.type === 'ahab'); if (ahb) badges.push(ahb.bloom ? '🔱가스하푼 개화' : `🔱희생 ${ahb.sac || 0}/3`);
    const snc = p.pieces.find((x) => x.type === 'sinclair'); if (snc) badges.push(snc.egg > 0 ? `🥚알 ${snc.egg}` : snc.form === 'any' ? '🌌어느 싱클레어' : `✒표지 ${snc.mark || 0}/3`);
    const fxr = p.pieces.find((x) => x.type === 'fixer'); if (fxr) badges.push(fxr.trait ? `🕴특색 ${{ red: '붉은시선', yellow: '노란작살', indigo: '쪽빛노인', black: '검은침묵' }[fxr.trait]}${fxr.weapon ? ' · ' + esc(fxr.weapon) : ''}` : `🕴${9 - (fxr.lv || 0)}급${(fxr.lv || 0) >= 8 ? ` (특색까지 ${fxr.ex || 0}/3)` : ''}`);
    p.pieces.filter((x) => x.type === 'ego' && !x.done).forEach((x) => badges.push(`🌸${{ bleed: '가시 돋친 입맞춤', breath: '무한한 궤적', tower: '무너지는 종루', rupture: '필연적인 균열', sink: '가라앉은 독백', charge: '폭풍의 전야', burn: '꺼지지 않는 장례식' }[x.ego] || ''}${x.ego === 'charge' ? ' ⚡' + (x.charge || 0) : ''}${x.ego === 'tower' ? ' ' + (x.uses || 0) + '/3' : ''}`));
    if (p.pieces.some((x) => x.type === 'distort' && !x.done)) badges.push('🌀뒤틀림');
    (S.lights || []).forEach((l) => { if (l.owner === p.idx) badges.push(`💚초록빛 ${l.left}`); });
    if (p.hp != null) badges.push(`❤${p.hp}`);
    if (p.st.skip) badges.push(`⏭${p.st.skip}`);
    if (p.st.leechTo != null) badges.push(`🪱${esc(S.players[p.st.leechTo].name)}와 운명공동체`);
    if (p.st.poison) badges.push('☠독');
    if (p.st.lastDance) badges.push('💃라스트댄스');
    if (p.st.nextChoose) badges.push('✋다음 윷 자유');
    if (p.st.plan === true || Array.isArray(p.st.plan)) badges.push('📋순위 예측함');
    S.duels.forEach((d) => { if (d.t === p.idx) badges.push(`⚔승부 ${d.left}차례 안에 완주!`); });
    const rk = S.ranks.indexOf(p.idx);
    let status = '';
    if (!p.alive) status = ' · 탈락'; else if (p.fixedRank) status = ` · 🥉${p.fixedRank}위 확정`; else if (rk >= 0) status = ` · 🏅${rk + 1}위 확정`;
    return `<div class="card ${S.phase === 'turn' && S.cur === p.idx ? 'cur' : ''} ${p.alive && !p.out ? '' : 'dead'}" style="margin-bottom:8px;padding:10px">
      <div class="row"><b><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.idx === S.me ? ' (나)' : ''}</b>${S.order ? `<span class="tag">${S.order.indexOf(p.idx) + 1}번째</span>` : ''}
      <span class="mut">완주 ${p.finished}/${p.npieces} · 윷 ${p.sticks}개${p.connected ? '' : ' · 접속 끊김'}${status}</span></div>
      <div class="homebox" style="margin:6px 0"><span class="mut">대기</span>${home.map((x) => `<span class="hp ${p.idx === S.me ? 'me' : ''}" style="background:${p.color}" ${p.idx === S.me ? `data-a="piece" data-v="${x.id}"` : ''}>${LET[x.type] || ''}${ICON[x.type] ? `<b class="dc">${ICON[x.type]}</b>` : ''}</span>`).join('') || '<span class="mut">-</span>'}</div>
      <div>${p.augs.map((id) => `<span class="chip ${A[id].pack === 'limbus' ? 'pk-limbus' : ''} ${p.used[id] ? 'used' : ''}" title="${esc(A[id].desc)}">${esc(A[id].name)}</span>`).join('') || '<span class="mut">증강 없음</span>'}</div>
      ${badges.length ? `<div class="mut">${badges.join(' · ')}</div>` : ''}${privInfo(p)}</div>`;
  }).join('');
}

    return `<div class="${mine === k ? 'mine' : ''}"><div><b>${k}사</b> ${mine === k ? '<span style="color:#ffd23f">보유</span>' : ''}</div><div><b class="${up ? 'up' : dn ? 'dn' : ''}">${t.v}</b> <span class="${up ? 'up' : dn ? 'dn' : ''}">${up ? '▲' : dn ? '▼' : '–'}${Math.abs(t.d)}</span></div><svg viewBox="0 0 60 22" style="height:22px;background:none;border-radius:0"><polyline points="${pts}" fill="none" stroke="${up ? '#ff6b6b' : dn ? '#6bb5ff' : '#9aa'}" stroke-width="1.6"/></svg><div class="mut" style="font-size:11px">이동 ${ef >= 0 ? '+' : ''}${ef}${owners[k] ? ' · ' + owners[k].map(esc).join(',') : ''}</div></div>`;
  }).join('') + '</div></div>';
}
let rpk = null;
function packModalHTML() {
  if (!meta || !meta.packs) return '';
  const k = meta.packs.find((x) => x.id === rpk) || meta.packs[0];
  return `<div class="pkm"><div class="pkbox"><div class="row" style="justify-content:space-between"><b>📦 증강팩 설명</b><button data-a="rpackx">✕ 닫기</button></div><div class="row" style="margin:8px 0">${meta.packs.map((x) => `<button data-a="rpackset" data-v="${x.id}" class="${x.id === k.id ? 'pri' : ''}">${esc(x.name)}</button>`).join('')}</div>${packListHTML(k, meta)}</div></div>`;
}
let leaveArm = 0;
function doLeave() {
  send({ t: 'leave' });
  setTimeout(() => { if (S) { fxQ.length = 0; lastSeq = null; lastFlickSeq = null; lastFxSeq = null; S = null; meta = null; rpk = null; resetUI(); try { localStorage.removeItem('yut_room'); } catch (e) { /* */ } render(); } }, 1500);
}
function askLeave(el) {
  const now = Date.now();
  if (now - leaveArm < 3500) { leaveArm = 0; doLeave(); return; }
  leaveArm = now; toast('한 번 더 누르면 방을 나갑니다');
  if (el) { const t = el.textContent; el.textContent = '정말 나가기?'; el.classList.add('arm'); setTimeout(() => { if (el.isConnected) { el.textContent = t; el.classList.remove('arm'); } }, 3500); }
}
(function () {
  const f = document.createElement('div'); f.id = 'fabs';
  f.innerHTML = '<button id="fab-pk">📦 팩</button><button id="fab-lv">🚪 나가기</button>'; document.body.appendChild(f);
  $('fab-pk').onclick = () => { rpk = (rpk ? null : (meta && meta.packs && meta.packs[0] ? meta.packs[0].id : null)); render(); };
  $('fab-lv').onclick = (e) => askLeave(e.currentTarget);
  setInterval(() => { f.style.display = S ? 'flex' : 'none'; }, 300);
})();

connect(true);
render();
</script>
