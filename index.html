<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증강 윷놀이</title>
<style>
:root{--bg:#14161c;--card:#1e222b;--card2:#272c38;--tx:#e8eaf0;--mut:#8b93a7;--ac:#ffb84d;--bd:#323848}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:15px}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);color:#1a1300;border-color:var(--ac);font-weight:700}
input[type=text]{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;width:100%}
h1{margin:0 0 4px;font-size:28px}
.wrap{max-width:1180px;margin:0 auto;padding:12px}
.center{max-width:420px;margin:8vh auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(300px,640px) 1fr;gap:12px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
svg{width:100%;height:auto;background:#222736;border-radius:12px;display:block}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--bd);font-size:12px;margin:2px 3px 2px 0;cursor:help}
.chip.used{opacity:.4;text-decoration:line-through}
.res{font-size:18px;font-weight:700;padding:8px 14px}
.res.sel{background:var(--ac);color:#1a1300;border-color:var(--ac)}
.cur{outline:2px solid var(--ac)}
.dead{opacity:.45}
.log{height:210px;overflow:auto;font-size:13px;line-height:1.55;color:#c8cddb}
.hint{background:#3a2f12;border:1px solid var(--ac);color:var(--ac);padding:8px 12px;border-radius:8px;margin:8px 0}
.overlay{position:fixed;inset:0;background:rgba(5,6,10,.82);display:flex;align-items:flex-start;justify-content:center;z-index:10;padding:12px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:900px;width:100%;margin:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.opt{text-align:left;padding:14px;background:var(--card2);border-radius:12px;border:2px solid var(--bd);cursor:pointer}
.opt:hover:not(.lock){border-color:var(--ac)}
.opt.lock{opacity:.35;cursor:not-allowed}
.opt b{font-size:17px;display:block;margin-bottom:6px}
.opt .d{font-size:13px;color:#c8cddb;line-height:1.45}
.tag{font-size:11px;color:var(--ac);margin-left:6px}
.augl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:45vh;overflow:auto;margin-top:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#552;border:1px solid var(--ac);padding:10px 18px;border-radius:10px;z-index:30;display:none}
.win{background:linear-gradient(90deg,#4a3500,#1e222b);border-color:var(--ac);font-size:18px}
.homebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hp{width:22px;height:22px;border-radius:50%;border:2px solid #000;display:inline-block;font-size:11px;text-align:center;line-height:18px;font-weight:700;color:#000}
.hp{position:relative;margin:0 3px}.hp .dc{position:absolute;top:-9px;right:-6px;font-size:11px;line-height:1}
.hp.me{cursor:pointer;box-shadow:0 0 0 2px var(--ac)}
.colorbtn{min-width:90px;font-weight:700;color:#111;border:2px solid #000}
.banner{background:#1d2a3a;border:1px solid #3d5a80;color:#bcd;padding:6px 10px;border-radius:8px;margin-bottom:8px;font-size:13px}
ol.final{margin:8px 0 0;padding-left:22px}

#fx2{display:none;position:fixed;inset:0;z-index:85;pointer-events:none}.fxtag{position:fixed;top:14px;left:0;right:0;text-align:center;color:#fff;font-size:22px;font-weight:800;text-shadow:0 2px 8px #000}
body.fxhide g[data-a="piece"]{opacity:0!important}
body.aiming svg[viewBox="0 0 100 100"]{touch-action:none;cursor:crosshair}
#fx{display:none;position:fixed;inset:0;z-index:90;pointer-events:none;align-items:center;justify-content:center;background:rgba(5,6,10,.88)}
.fxbox{text-align:center;perspective:700px}
.fxname{color:#fff;font-size:16px;margin-bottom:18px;text-shadow:0 1px 4px #000}
.fxrow{display:flex;gap:14px;justify-content:center;height:150px;align-items:flex-end;margin-bottom:10px}
.stick{width:22px;height:120px;position:relative;transform-style:preserve-3d}
.sf{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sf.flat{background:linear-gradient(90deg,#f3dca8,#e2bd78);border:2px solid #b98a45}
.sf.flat i{position:absolute;left:3px;right:3px;top:12px;height:10px;border-radius:5px;background:#d33}
.sf.round{background:linear-gradient(90deg,#5a3a1c,#7a5128);border:2px solid #3b2410;transform:rotateX(180deg)}
.ogrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:340px;margin:0 auto}.ocell{width:100px}.oname{font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}.fxrow.small{height:100px;gap:6px}.fxrow.small .stick{width:13px;height:70px}.ores{font-size:26px;font-weight:800;min-height:34px;opacity:0;transition:opacity .25s;text-shadow:0 2px 6px #000}.ores.show{opacity:1}
.fxres{font-size:54px;font-weight:800;min-height:64px;opacity:0;transform:scale(.6);transition:all .25s;text-shadow:0 2px 8px #000}
.fxres.show{opacity:1;transform:scale(1)}
#log div{}.priv{font-size:12px;margin-top:4px;padding:4px 6px;border-radius:6px;background:rgba(255,183,3,.12);border:1px solid rgba(255,183,3,.35)}
#mute{position:fixed;right:10px;bottom:10px;z-index:80;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}

/* 증강팩 화면 · 림버스 팩(지옥 제1원 '림보') 테마 */
.pk-limbus{position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 120%,rgba(255,120,40,.35),transparent 60%),linear-gradient(160deg,#4a0d17 0%,#25060b 60%,#150306 100%)!important;border:2px solid #b3182b!important;box-shadow:inset 0 0 0 1px rgba(232,190,110,.35),0 0 14px rgba(179,24,43,.35)}
.pk-limbus::before{content:"";position:absolute;right:-26px;top:-26px;width:120px;height:120px;opacity:.2;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='none' stroke='%23ffb37a' stroke-width='3'/><circle cx='50' cy='50' r='39' fill='none' stroke='%23ffb37a' stroke-width='1'/><g stroke='%23ffb37a' stroke-width='3' stroke-linecap='round'><path d='M50 8v8M50 84v8M8 50h8M84 50h8'/></g><g stroke='%23ffb37a' stroke-width='1.6'><path d='M71 14l-4 7M86 29l-7 4M86 71l-7-4M71 86l-4-7M29 86l4-7M14 71l7-4M14 29l7 4M29 14l4 7'/></g><path d='M50 50V22M50 50l18 10' stroke='%23ffb37a' stroke-width='3' stroke-linecap='round'/><circle cx='50' cy='50' r='3.5' fill='%23ffb37a'/></svg>") no-repeat center/contain}
.pk-limbus::after{content:"✦ 지옥 제1원 · 림보 ✦";position:absolute;left:0;right:0;bottom:0;padding:2px 0;text-align:center;font-size:10px;letter-spacing:2px;color:rgba(255,205,150,.75);background:linear-gradient(90deg,transparent,rgba(179,24,43,.55),transparent);pointer-events:none}
.opt.pk-limbus{padding-bottom:24px}
.opt.pk-limbus:hover:not(.lock){border-color:#e8be6e!important}
.pk-limbus b{font-family:Georgia,'Nanum Myeongjo','Noto Serif KR',serif;color:#ffe3c2;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.pk-limbus .d{color:#f1cfc4!important}
.pk-limbus .tag{background:rgba(232,190,110,.2);color:#ffd9a0}
.chip.pk-limbus{padding-bottom:2px;border-width:1px!important}.chip.pk-limbus::before,.chip.pk-limbus::after{display:none}
.packbox{width:100%;max-width:560px;margin:0 auto;text-align:left}
.packbtn.pk-limbus{padding-bottom:24px}
.packbtn{display:block;width:100%;text-align:left;margin-top:8px}
.packhead{padding:14px;border-radius:12px;margin-bottom:10px}
.packhead.pk-limbus::after{display:none}
.augrow{padding:10px 12px;margin-top:6px;border-radius:10px;background:var(--card2);border:1px solid var(--bd)}
.augrow.pk-limbus{padding-bottom:10px}.augrow.pk-limbus::after{display:none}.augrow.pk-limbus::before{width:70px;height:70px;right:-14px;top:-14px}
.augrow b{display:block}.augrow .d{font-size:13px;color:#c8cddb;line-height:1.45;margin-top:3px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="fx"></div>
<div id="fx2"></div>
<button id="mute" onclick="toggleMute()" title="효과음"></button>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const VERSION = 'v1.10 (팩 보기 · 림버스 테마 · 림버스 컴퍼니 팩 · 증강팩 · 알까기 물리 · 동시 증강 선택 · 윷으로 순서 정하기 · 변신 말 장식 · 2026-10-31)';
const RES = ['백도', '도', '개', '걸', '윷', '모'];
const COLORS = ['#e5484d', '#3e8ef7', '#30a46c', '#f5c518', '#a855f7', '#f97316'], COLOR_NAMES = ['빨강', '파랑', '초록', '노랑', '보라', '주황'];
const LET = { lord: '군', lucio: '루', valen: '발', hunt: '헌', vanguard: '선', zealot: '광', marathon: '마', goblin: '깨', cannon: '포', pawn: '폰', kim: '김', queen: '후' };
let ws, meta = null, S = null, ui = { ri: 0, mode: null, abil: null, pid: null };
let token = localStorage.getItem('yut_token');
if (!token) { token = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('yut_token', token); }
const AUG = () => Object.fromEntries((meta ? meta.augments : []).map((a) => [a.id, a]));
const resetUI = () => { ui.mode = null; ui.abil = null; ui.pid = null; };

function connect(first) {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => {
    const room = localStorage.getItem('yut_room');
    if (first && room) ws.send(JSON.stringify({ t: 'join', code: room, name: localStorage.getItem('yut_name') || '', token }));
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'joined') { meta = m.meta; localStorage.setItem('yut_room', m.code); }
    else if (m.t === 'state') enqueueState(m.s);
    else if (m.t === 'left') { fxQ.length = 0; lastSeq = null; lastFlickSeq = null; S = null; meta = null; resetUI(); localStorage.removeItem('yut_room'); render(); }
    else if (m.t === 'err') { toast(m.msg); if (!S) { localStorage.removeItem('yut_room'); render(); } }
  };

}
function applyState(ns) { const prevN = S ? S.logN : null; S = ns; notifyNew(prevN); if (S.phase !== 'turn' || S.cur !== S.me) resetUI(); render(); }
// ---- 윷 던지기 연출: 새 던지기가 담긴 상태는 연출이 끝난 뒤 화면에 반영 (결과 미리 노출 방지) ----
let lastSeq = null, lastFlickSeq = null, fxQ = [], fxBusy = false;
function enqueueState(ns) {
  fxQ.push(ns);
  if (!fxBusy) drain();
}
async function drain() {
  fxBusy = true;
  while (fxQ.length) {
    const ns = fxQ.shift(), t = ns.lastThrow;
    const seq = t ? t.seq : 0;
    if (t && lastSeq !== null && seq > lastSeq && !document.hidden) {
      lastSeq = seq;
      try { await playThrow(t, ns); } catch (e) { /* 연출 실패는 무시 */ }
    } else if (lastSeq === null || seq > lastSeq) lastSeq = seq;
    else if (!t) lastSeq = 0;
    const f = ns.lastFlick, fs = f ? f.seq : 0;
    if (f && lastFlickSeq !== null && fs > lastFlickSeq && !document.hidden) {
      lastFlickSeq = fs;
      try { await playFlick(f, ns); } catch (e) { document.body.classList.remove('fxhide'); const r2 = $('fx2'); if (r2) { r2.style.display = 'none'; r2.innerHTML = ''; } }
    } else if (lastFlickSeq === null || fs > lastFlickSeq) lastFlickSeq = fs;
    else if (!f) lastFlickSeq = 0;
    applyState(ns);
  }
  fxBusy = false;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let muted = false; try { muted = localStorage.getItem('yut_mute') === '1'; } catch (e) { /* */ }
let AC = null;
function audio() {
  try { if (!AC) { const A = window.AudioContext || window.webkitAudioContext; if (A) AC = new A(); } if (AC && AC.state === 'suspended') AC.resume(); } catch (e) { /* */ }
  return AC;
}
['pointerdown', 'keydown', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => audio(), { passive: true }));
function tone(freq, t0, dur, type, vol, slideTo) {
  const ac = AC; if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, ac.currentTime + t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, ac.currentTime + t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + 0.05);
}
function noise(t0, dur, vol, freq) {
  const ac = AC; if (!ac) return;
  const len = Math.max(1, Math.floor(ac.sampleRate * dur)), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq || 1500; f.Q.value = 1.2; g.gain.value = vol || 0.3;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(ac.currentTime + t0);
}
const sfx = {
  whoosh() { noise(0, 0.35, 0.18, 700); },
  hit(s) { noise(0, 0.06, 0.25 + 0.4 * s, 2600); tone(150 + 80 * s, 0, 0.1, 'triangle', 0.15 + 0.2 * s); },
  fall() { tone(520, 0, 0.5, 'sine', 0.14, 90); },
  clack(t0) { noise(t0, 0.07, 0.5, 2200); tone(180 + Math.random() * 60, t0, 0.09, 'triangle', 0.25); },
  result(r) {
    const seq = { '도': [[392, 0], [494, 0.12]], '개': [[392, 0], [494, 0.12], [587, 0.24]], '걸': [[392, 0], [494, 0.12], [587, 0.24], [698, 0.36]],
      '윷': [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.32]], '모': [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.32], [1319, 0.46]] }[r];
    if (seq) seq.forEach(([f, t]) => tone(f, t, 0.22, r === '윷' || r === '모' ? 'square' : 'triangle', 0.16));
    else if (r === '백도') { tone(330, 0, 0.2, 'sawtooth', 0.12); tone(247, 0.18, 0.3, 'sawtooth', 0.12); }
    else if (r === '탈락') tone(400, 0, 0.8, 'sawtooth', 0.15, 80);
  },
};
function play(fn) { if (muted) return; try { if (audio()) fn(); } catch (e) { /* */ } }
function toggleMute() { muted = !muted; try { localStorage.setItem('yut_mute', muted ? '1' : '0'); } catch (e) { /* */ } const b = $('mute'); if (b) b.textContent = muted ? '🔇' : '🔊'; if (!muted) audio(); }
const RCOLOR = { '도': '#fff', '개': '#fff', '걸': '#ffd166', '윷': '#ffb703', '모': '#ff6b6b', '백도': '#9ecbff', '탈락': '#999' };
function stickEl(up, marked) {
  const d = document.createElement('div'); d.className = 'stick';
  d.innerHTML = '<div class="sf flat">' + (marked ? '<i></i>' : '') + '</div><div class="sf round"></div>';
  d._up = up; return d;
}
async function playOrder(t, ns) {
  const root = $('fx'); if (!root) return;
  root.innerHTML = ''; root.style.display = 'flex';
  const box = document.createElement('div'); box.className = 'fxbox'; root.appendChild(box);
  const nm = document.createElement('div'); nm.className = 'fxname'; nm.textContent = '🎲 윷을 던져 차례를 정합니다! (큰 순서대로 먼저)'; box.appendChild(nm);
  for (let k = 0; k < t.rounds.length; k++) {
    const rd = t.rounds[k];
    const head = document.createElement('div'); head.className = 'fxname'; head.textContent = t.rounds.length > 1 ? (k === 0 ? '1차' : `동점! ${k + 1}차 재대결`) : ''; box.appendChild(head);
    const grid = document.createElement('div'); grid.className = 'ogrid'; box.appendChild(grid);
    const resEls = [];
    play(sfx.whoosh);
    rd.forEach((x) => {
      const cell = document.createElement('div'); cell.className = 'ocell';
      const nmE = document.createElement('div'); nmE.className = 'oname'; nmE.textContent = ns.players[x.by] ? ns.players[x.by].name : ''; nmE.style.color = ns.players[x.by] ? ns.players[x.by].color : '#fff';
      const row = document.createElement('div'); row.className = 'fxrow small';
      const sticks = x.items[0].faces.map((u, i) => { const e = stickEl(u, i === 0); row.appendChild(e); return e; });
      const r = document.createElement('div'); r.className = 'ores'; resEls.push([r, x.items[0].res]);
      cell.appendChild(nmE); cell.appendChild(row); cell.appendChild(r); grid.appendChild(cell);
      sticks.forEach((e, i) => {
        const rot = 360 * (2 + (i % 2)) + (e._up ? 0 : 180), dur = 1100 + i * 60;
        if (!e.animate) { e.style.transform = 'rotateX(' + rot + 'deg)'; return; }
        e.animate([
          { transform: 'translateY(30px) rotateX(0deg)', offset: 0 },
          { transform: 'translateY(-120px) rotateX(' + rot * 0.5 + 'deg)', offset: 0.45, easing: 'ease-in' },
          { transform: 'translateY(0) rotateX(' + rot + 'deg)', offset: 0.8, easing: 'ease-out' },
          { transform: 'translateY(-12px) rotateX(' + rot + 'deg)', offset: 0.9, easing: 'ease-in' },
          { transform: 'translateY(0) rotateX(' + rot + 'deg)', offset: 1 },
        ], { duration: dur, fill: 'forwards' });
      });
    });
    setTimeout(() => play(() => { sfx.clack(0); sfx.clack(0.07); sfx.clack(0.15); }), 900);
    await sleep(1500);
    resEls.forEach(([r, res]) => { r.textContent = res; r.style.color = RCOLOR[res] || '#fff'; r.classList.add('show'); });
    play(() => sfx.result(rd.reduce((a, x) => (RES_RANK[x.items[0].res] > RES_RANK[a] ? x.items[0].res : a), '백도')));
    await sleep(1100);
  }
  const fin = document.createElement('div'); fin.className = 'fxres show'; fin.style.fontSize = '20px'; fin.style.color = '#fff';
  fin.textContent = '차례: ' + t.order.map((i) => ns.players[i].name).join(' → '); box.appendChild(fin);
  await sleep(1800);
  root.style.display = 'none'; root.innerHTML = '';
}
const RES_RANK = { '백도': 0, '도': 1, '개': 2, '걸': 3, '윷': 4, '모': 5, '탈락': -1 };

// ---- 알까기: 당겨서 쏘기 ----
let aim = null;
const svgPt = (svg, e) => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const m = svg.getScreenCTM(); return m ? pt.matrixTransform(m.inverse()) : { x: 50, y: 50 }; };
function aimGeom(e) {
  const me = S.players[S.me]; const pc = me.pieces.find((x) => x.id === ui.pid); if (!pc) return null;
  const [px, py] = nodeXY(pc.pos); const pt = svgPt(aim.svg, e);
  const dx = pt.x - aim.sx, dy = pt.y - aim.sy; const len = Math.hypot(dx, dy);
  const pow = Math.min(1, len / 32); const ang = Math.atan2(-dy, -dx);
  return { px, py, pow, ang, len, dx, dy };
}

const C = [[90, 90], [90, 10], [10, 10], [10, 90]], MID = [50, 50];

  if (n === 23 || n === 24) return lerp(MID, C[3], (n - 22) / 3);
  if (n === 25 || n === 26) return lerp(C[2], MID, (n - 24) / 3);

      return `<path pointer-events="none" d="M${x - 2.6} ${y - 3} L${x - 2.8} ${y - 6.2} L${x - 1.3} ${y - 4.6} L${x} ${y - 6.8} L${x + 1.3} ${y - 4.6} L${x + 2.8} ${y - 6.2} L${x + 2.6} ${y - 3} Z" fill="#ffd23f" stroke="#7a5a00" stroke-width="0.35" stroke-linejoin="round"/>`;
    case 'pawn': // 폰 머리
      return `<g pointer-events="none"><circle cx="${x}" cy="${y - 5.1}" r="1.5" fill="#eee" stroke="#222" stroke-width="0.35"/><rect x="${x - 1.9}" y="${y - 3.9}" width="3.8" height="0.9" rx="0.3" fill="#eee" stroke="#222" stroke-width="0.3"/></g>`;
    case 'kim': // 삿갓
      return `<g pointer-events="none"><path d="M${x - 4.4} ${y - 2.6} Q${x} ${y - 7.8} ${x + 4.4} ${y - 2.6} Z" fill="#d9b86a" stroke="#6b4b12" stroke-width="0.4"/><line x1="${x - 2.6}" y1="${y - 4.3}" x2="${x + 2.6}" y2="${y - 4.3}" stroke="#6b4b12" stroke-width="0.25"/></g>`;
    case 'marathon': // 머리띠 + 땀방울
      return `<g pointer-events="none"><path d="M${x - 3.4} ${y - 1.6} Q${x} ${y - 3.6} ${x + 3.4} ${y - 1.6} L${x + 3.2} ${y - 0.4} Q${x} ${y - 2.4} ${x - 3.2} ${y - 0.4} Z" fill="#fff" stroke="#c22" stroke-width="0.35"/><circle cx="${x}" cy="${y - 1.9}" r="0.7" fill="#e22"/><path d="M${x + 4.3} ${y - 3} q0.7 1.1 0 1.6 q-0.7 -0.5 0 -1.6Z" fill="#6cf"/></g>`;
    default: return '';
  }
}

// ---- 능력 정의 ----
// k: now(즉시) / p(내 말) / pn(말→칸) / n(칸) / pe(내 말→적 말) / pd(말→방향) / player(상대 선택) / dead(탈락자 선택)
const ABIL = {
  timetravel: { k: 'pn', hint: ['되돌릴 내 말을 클릭하세요', '돌아갈 칸을 클릭하세요'] },
  shield: { k: 'p', hint: ['보호막을 씌울 내 말뭉치를 클릭하세요'] },
  sacrifice: { k: 'p', hint: ['희생시킬 내 말을 클릭하세요'] },
  sniper: { k: 'n', needThrow: true, hint: ['저격할 칸을 클릭하세요 (던지기 기회 1회 소모)'] },
  baduk: { k: 'now' }, handfast: { k: 'now' }, chalice: { k: 'now' }, fog: { k: 'now' },
  lastdance: { k: 'now', confirm: '이번 턴이 끝나면 탈락합니다. 정말 사용할까요?' },
  truck: { k: 'p', pre: true, hint: ['달릴 말뭉치(말 2개 이상)를 클릭하세요 (직선으로 벽까지 달립니다)'] },
  combo: { k: 'p', pre: true, hint: ['합체할 말뭉치(말 3개 이상)를 클릭하세요'] },
  flick: { k: 'fl', pre: true, hint: ['튕길 내 말을 클릭하세요', '판 위에서 뒤로 쭉 당겼다 놓으세요 (당긴 반대 방향으로 발사 · 길게 당길수록 세게)'] },
  goblin: { k: 'pd', hint: ['도깨비를 클릭하세요', '방향을 고르세요'] },
  cannon: { k: 'pn', hint: ['포를 클릭하세요', '도착할 칸을 클릭하세요 (가는 방향의 직선 위에서, 말이 있는 칸을 정확히 하나 넘어 벽까지)'] },
  domain: { k: 'p', hint: ['움직이지 못하게 할 내 말을 클릭하세요'] },
  aim: { k: 'player', hint: ['맞힐 플레이어를 고르세요'] },
  necro: { k: 'dead', hint: ['부활시킬 플레이어를 고르세요'] },
  lord: { k: 'now', pre: true, can: (m) => (m.st.lim.lordMark || 0) >= 2, confirm: '이번 차례를 쓰고 군주의 앞칸·뒤칸에 흑수를 배치합니다. 사용할까요?' },
  hunt: { k: 'now', can: (m) => m.st.lim.coffin > 0 && (m.st.lim.graves || []).length > 0 },
  ksa: { k: 'n', can: (m) => m.st.lim.amp > 0 && (m.st.lim.graves || []).length > 0, nodes: (m) => m.st.lim.graves || [], hint: ['부활시킬 무덤 칸을 클릭하세요 (무덤 칸이나 그 앞뒤 칸에 내 말이 있어야 합니다)'] },
  yakji: { k: 'yakji', pre: true, can: (m) => (m.st.lim.bio || 0) >= 4 },
};
const REPEAT = { goblin: 'goblin', cannon: 'cannon' }; // 턴마다 쓰는 능력 (tn 플래그)

function abilHint() {
  const d = ABIL[ui.abil]; if (!d) return '';
  if (ui.mode === 'sel_side') return '속박할 면을 고르세요 (그 면 위의 모든 말이 2라운드 동안 움직이지 못합니다)';
  const step = ui.mode === 'sel_p' || ui.mode === 'sel_player' || ui.mode === 'sel_dead' ? 0 : 1;
  return d.hint[Math.min(step, d.hint.length - 1)];
}
function controlsHTML(me) {
  const tn = S.tn; let h = '';
  const A = AUG();
  if (tn.throws > 0) {
    h += `<div class="mut">던질 기회: ${tn.throws}회</div><div class="row" style="margin:6px 0">`;
    if (me.st.nextChoose) h += RES.map((r) => `<button class="pri" data-a="throw" data-v="${r}">${r}</button>`).join('') + '<span class="mut">원하는 결과를 고르세요</span>';
    else if (me.augs.includes('dogpig')) h += `<button class="pri" data-a="throw" data-v="도">도</button><button class="pri" data-a="throw" data-v="개">개</button>`;
    else h += `<button class="pri" data-a="throw" data-v="">🎲 윷 던지기</button>`;
    if (me.augs.includes('doberman') && me.st.coins >= 2) h += `<button data-a="coin" data-v="">🐶 개 코인 2개 → 모 (${me.st.coins})</button>`;
    h += '</div>';
  }
  if (tn.queue.length) {
    if (ui.ri >= tn.queue.length) ui.ri = 0;
    h += `<div class="mut">사용할 결과를 고르고 → 말을 클릭</div><div class="row" style="margin:6px 0">` +
      tn.queue.map((r, i) => `<button class="res ${i === ui.ri ? 'sel' : ''}" data-a="ri" data-v="${i}">${r}</button>`).join('') + '</div>';
    if (tn.throws > 0) h += '<div class="mut">※ 던질 기회를 모두 쓴 뒤에 말을 움직일 수 있습니다</div>';
  }
  const ab = me.augs.filter((id) => ABIL[id]);
  if (ab.length) {
    h += '<div class="row" style="margin-top:8px">' + ab.map((id) => {
      const d = ABIL[id];
      let off = !!me.used[id];
      if (REPEAT[id] && tn[REPEAT[id]]) off = true;
      if (d.pre && tn.thrown) off = true;
      if (d.can && !d.can(me)) off = true;
      return `<button data-a="abil" data-v="${id}" ${off ? 'disabled' : ''} title="${esc(A[id].desc)}">⚡ ${id === 'yakji' ? (me.st.lim.art ? '폐장' : '예술!') : esc(A[id].name)}</button>`;
    }).join('') + '</div>';
  }
  if (ui.mode) {
    const others = S.players.filter((p) => p.alive && !p.out && p.idx !== S.me);
    let extra = '';
    if (ui.mode === 'sel_player') extra = others.map((p) => `<button data-a="abil_t" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('');
    if (ui.mode === 'sel_dead') extra = S.players.filter((p) => !p.alive).map((p) => `<button data-a="abil_t" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('') || '<span class="mut">탈락한 플레이어가 없습니다</span>';
    if (ui.mode === 'sel_side') extra = ['R', 'L', 'T', 'B'].map((sd) => `<button data-a="side" data-v="${sd}">${{ R: '오른쪽', L: '왼쪽', T: '위쪽', B: '아래쪽' }[sd]} 면 속박</button>`).join('');
    if (ui.mode === 'sel_d') extra = '<button data-a="dir" data-v="1">도 (앞으로 1칸)</button><button data-a="dir" data-v="-1">백도 (뒤로 1칸)</button>';
    if (ui.abil === 'timetravel' && ui.mode === 'sel_n') extra = '<button data-a="tthome">대기칸으로</button>';
    h += `<div class="hint">${abilHint()} <button data-a="cancel">취소</button> ${extra}</div>`;
  }
  return h;
}

function privInfo(p) {
  if (p.idx !== S.me || !p.st.lim) return '';
  const lm = p.st.lim; let o = '';
  if (lm.quest) o += `<div class="priv">🔎 <b>지령</b>: ${esc(lm.quest.text)}${lm.quest.progress ? ` <span class="mut">(${esc(lm.quest.progress)})</span>` : ''}</div>`;
  if (lm.lake != null && meta.rules) o += `<div class="priv">🌊 <b>내가 정한 규칙</b>: ${esc(meta.rules[lm.lake])}</div>`;
  if (lm.knows && lm.knows.length) o += lm.knows.map((k) => `<div class="priv">🌊 알게 된 규칙(${esc(S.players[k.by].name)}): ${esc(k.text)}</div>`).join('');
  return o;
}
function playerCards() {
  const A = AUG();
  return S.players.map((p) => {
    const home = p.pieces.filter((x) => !x.done && x.pos === 0);
    const badges = [];
    if (p.st.coins) badges.push(`🐶${p.st.coins}`);
    if (p.augs.includes('summon')) badges.push(`🔮${p.st.ritual}/12`);
    if (p.augs.includes('garlic')) badges.push(`🧄${p.st.garlicGot.length}/3`);
    if (p.augs.includes('coup')) badges.push(`⚔${p.st.kills}/4`);
    if (p.augs.includes('cow')) badges.push(`🐂${p.st.backdoCaps}/2`);
    if (p.augs.includes('score')) badges.push(`🎼${p.st.seen.length}/6`);
    if (p.augs.includes('nofriend')) badges.push(`🥲${p.st.friendHits.length}/${S.players.filter((q) => q.alive).length - 1}`);
    if (p.augs.includes('queen')) badges.push(`👑목숨+${p.st.queenLives} · 던짐 ${p.st.queenThrows}/12`);
    if (p.augs.includes('kim') && p.st.kimLeft > 0) badges.push(`🎎${p.st.kimLeft}차례 남음`);
    if (p.st.domain) badges.push(`🌀영역 ${p.st.domain.left}`);
    const lm = p.st.lim || {};
    if (p.augs.includes('lamancha')) badges.push(`🩸피 ${lm.blood || 0}`);
    if (p.augs.includes('ksa')) badges.push(`💉앰플 ${lm.amp || 0}${lm.graves && lm.graves.length ? ' · 🪦' + lm.graves.length : ''}`);
    if (p.augs.includes('hunt')) badges.push(`⚰관 ${lm.coffin || 0}${lm.timers ? ' · 부활 중 ' + lm.timers : ''}`);
    if (p.augs.includes('lord')) badges.push(`🐺흑수의 주인 ${lm.lordMark || 0}/2`);
    if (p.augs.includes('yakji')) badges.push(`🧬${lm.bio || 0}/4${lm.art ? ' · 🎨예술 완성' : ''}`);
    if (p.augs.includes('tsa') && p.st.bank) badges.push(`⏳보관 윷 ${p.st.bank}`);
    if (p.augs.includes('geomji')) badges.push(`🔎지령 ${lm.qdone || 0}/3`);
    if (p.hp != null) badges.push(`❤${p.hp}`);
    if (p.st.skip) badges.push(`⏭${p.st.skip}`);
    if (p.st.leechTo != null) badges.push(`🪱${esc(S.players[p.st.leechTo].name)}와 운명공동체`);
    if (p.st.poison) badges.push('☠독');
    if (p.st.lastDance) badges.push('💃라스트댄스');
    if (p.st.nextChoose) badges.push('✋다음 윷 자유');
    if (p.st.plan === true || Array.isArray(p.st.plan)) badges.push('📋순위 예측함');
    S.duels.forEach((d) => { if (d.t === p.idx) badges.push(`⚔승부 ${d.left}차례 안에 완주!`); });
    const rk = S.ranks.indexOf(p.idx);
    let status = '';
    if (!p.alive) status = ' · 탈락'; else if (p.fixedRank) status = ` · 🥉${p.fixedRank}위 확정`; else if (rk >= 0) status = ` · 🏅${rk + 1}위 확정`;
    return `<div class="card ${S.phase === 'turn' && S.cur === p.idx ? 'cur' : ''} ${p.alive && !p.out ? '' : 'dead'}" style="margin-bottom:8px;padding:10px">
      <div class="row"><b><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.idx === S.me ? ' (나)' : ''}</b>${S.order ? `<span class="tag">${S.order.indexOf(p.idx) + 1}번째</span>` : ''}
      <span class="mut">완주 ${p.finished}/${p.npieces} · 윷 ${p.sticks}개${p.connected ? '' : ' · 접속 끊김'}${status}</span></div>
      <div class="homebox" style="margin:6px 0"><span class="mut">대기</span>${home.map((x) => `<span class="hp ${p.idx === S.me ? 'me' : ''}" style="background:${p.color}" ${p.idx === S.me ? `data-a="piece" data-v="${x.id}"` : ''}>${LET[x.type] || ''}${ICON[x.type] ? `<b class="dc">${ICON[x.type]}</b>` : ''}</span>`).join('') || '<span class="mut">-</span>'}</div>
      <div>${p.augs.map((id) => `<span class="chip ${A[id].pack === 'limbus' ? 'pk-limbus' : ''} ${p.used[id] ? 'used' : ''}" title="${esc(A[id].desc)}">${esc(A[id].name)}</span>`).join('') || '<span class="mut">증강 없음</span>'}</div>
      ${badges.length ? `<div class="mut">${badges.join(' · ')}</div>` : ''}${privInfo(p)}</div>`;
  }).join('');
}

        (meta.rules || []).map((r, i) => `<button data-a="sub" data-v="${i}" style="text-align:left">${esc(r)}</button>`).join('') + '</div>';
    } else if (sub.type === 'fold') {
      h += `<p>🧻 게임 접어라: 접는 방향을 고르세요. 접히는 쪽의 말은 반대편 칸으로 옮겨가며, 그 칸에 있던 적을 잡습니다.</p><div class="row">
        <button data-a="sub" data-v="R">→ 오른쪽을 왼쪽으로</button><button data-a="sub" data-v="L">← 왼쪽을 오른쪽으로</button>
        <button data-a="sub" data-v="T">↓ 위쪽을 아래로</button><button data-a="sub" data-v="B">↑ 아래쪽을 위로</button></div>`;
    } else if (sub.type === 'spin') {
      h += `<p>🎡 돌림판 결과: 시계 반대 방향으로 <b>${sub.k * 90}°</b> 회전 (말이 ${sub.k * 5}칸씩 이동합니다)</p><div class="row"><button class="pri" data-a="sub" data-v="keep">이대로 확정</button>${sub.respun ? '<span class="mut">(이미 한 번 다시 돌림)</span>' : '<button data-a="sub" data-v="respin">🔄 다시 돌리기 (1회)</button>'}</div>`;
    } else if (sub.type === 'rank') {
      h += `<p>📋 계획대로: 최종 순위를 1위부터 차례로 예측하세요.</p><div class="mut">지금까지: ${sub.picks.map((i, k) => `${k + 1}위 ${esc(S.players[i].name)}`).join(' / ') || '-'}</div><div class="row" style="margin-top:8px">` +
        S.players.filter((p) => !sub.picks.includes(p.idx)).map((p) => `<button data-a="sub" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)} → ${sub.picks.length + 1}위</button>`).join('') + '</div>';
    }
  } else if (pk.stage === 'choose') {
    if (pk.mine.length) h += `<div class="mut">이미 고른 증강: ${pk.mine.map((id) => esc(A[id].name)).join(', ')}</div>`;
    h += '<div class="opts">' + pk.options.map((o) => { const a = A[o.id]; return `<div class="opt ${a.pack === 'limbus' ? 'pk-limbus' : ''} ${o.locked ? 'lock' : ''}" ${o.locked ? '' : `data-a="pick" data-v="${o.id}"`}><b>${esc(a.name)}<span class="tag">${{ gen: '범용', start: '시작 전용', mid: '중간 전용', end: '마무리 전용' }[a.cat]}</span></b><div class="d">${esc(a.desc)}</div></div>`; }).join('') + '</div>';
  }
  if (pk.stage === 'resolve' && !sub && pk.picker === S.me) h += '<p class="mut">처리 중...</p>';
  if (pk.banned.length) h += `<div class="mut" style="margin-top:10px">🔍 이번 선택에서 무효화됨: ${pk.banned.map((id) => esc(A[id].name)).join(', ')}</div>`;
  h += '<div style="margin-top:12px">' + playerCards() + '</div></div></div>';
  return h;
}

let pre = null, packView = null; // 방에 들어가기 전에도 팩을 볼 수 있도록 /api/meta를 받아 둠
fetch('/api/meta').then((r) => r.json()).then((m) => { pre = m; if (!S) render(); }).catch(() => { /* 서버 주소가 다르면 무시 */ });
const CATN = { gen: '범용', start: '시작 전용', mid: '중간 전용', end: '마무리 전용', hidden: '특수' };
function packListHTML(k, ms) {
  const augs = ms.augments.filter((a) => (a.pack || 'base') === k.id && a.cat !== 'hidden');
  const cls = k.id === 'limbus' ? 'pk-limbus' : '';
  let o = `<div class="packhead card ${cls}"><b style="font-size:19px">📦 ${esc(k.name)}</b><div class="mut" style="margin-top:4px">${esc(k.desc)} · 증강 ${augs.length}개</div></div>`;
  for (const c of ['gen', 'start', 'mid', 'end']) {
    const list = augs.filter((a) => a.cat === c); if (!list.length) continue;
    o += `<div class="mut" style="margin:12px 0 2px">${CATN[c]} (${list.length})</div>` + list.map((a) => `<div class="augrow ${cls}"><b>${esc(a.name)}</b><div class="d">${esc(a.desc)}</div></div>`).join('');
  }
  return o;
}
function landingHTML() {
  if (packView && pre) {
    const k = pre.packs.find((x) => x.id === packView);
    return `<div class="center"><div class="packbox"><div class="row" style="margin-bottom:10px"><button data-a="packback">← 돌아가기</button></div>${k ? packListHTML(k, pre) : ''}</div></div>`;
  }
  const packs = pre ? `<div class="card" style="margin-top:12px"><b>📦 증강팩</b> <span class="mut">눌러서 들어있는 증강을 확인하세요</span>` +
    pre.packs.map((k) => `<button class="packbtn ${k.id === 'limbus' ? 'pk-limbus' : ''}" data-a="packview" data-v="${k.id}"><b>${esc(k.name)}</b> <span class="mut">· 증강 ${pre.augments.filter((a) => (a.pack || 'base') === k.id && a.cat !== 'hidden').length}개</span><div class="mut" style="font-size:12px">${esc(k.desc)}</div></button>`).join('') + '</div>' : '';
  return `<div class="center"><h1>🎲 증강 윷놀이</h1><p class="mut">최대 6인 · 라운드 1/5/10에 증강 선택</p>
  <div class="card"><div class="mut">이름</div><input type="text" id="nm" maxlength="10" value="${esc(localStorage.getItem('yut_name') || '')}" placeholder="이름">
  <div class="row" style="margin-top:12px"><button class="pri" data-a="create">새 방 만들기</button></div>
  <hr style="border-color:#323848;margin:16px 0"><div class="mut">친구가 알려준 방 코드</div>
  <div class="row"><input type="text" id="cd" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;width:120px"><button data-a="join">입장</button></div></div>${packs}<div class="mut" style="margin-top:10px">버전 ${VERSION}</div></div>`;
}
function lobbyHTML() {
  const host = S.me === 0;
  return `<div class="center"><h1>방 코드: ${esc(S.code)}</h1><p class="mut">친구에게 이 코드를 알려주세요 (같은 서버 주소로 접속)</p>
  <div class="card">${S.players.map((p) => `<div><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.idx === 0 ? ' 👑' : ''}${p.idx === S.me ? ' (나)' : ''}</div>`).join('')}</div>
  <div class="card"><label><input type="checkbox" data-a="chaos" ${S.chaos ? 'checked' : ''} ${host ? '' : 'disabled'}> 🌀 혼돈 모드 (증강을 한 번에 2번 고름)</label>
  <div style="height:8px"></div>
  <label><input type="checkbox" data-a="ranking" ${S.ranking ? 'checked' : ''} ${host ? '' : 'disabled'}> 🏅 순위전 (한 명이 이겨도 끝나지 않고 순위를 끝까지 가림 · 계획대로/동메달/취~소 증강 등장)</label></div>
  <div class="card"><b>📦 증강팩</b> <span class="mut">${host ? '(여러 개 선택 가능)' : '(방장이 선택)'}</span>
  ${(meta.packs || []).map((k) => `<div style="margin-top:6px"><label><input type="checkbox" data-a="pack" data-v="${k.id}" ${(S.packs || []).includes(k.id) ? 'checked' : ''} ${host ? '' : 'disabled'}> ${esc(k.name)} <span class="mut">· 증강 ${meta.augments.filter((a) => a.pack === k.id && a.cat !== 'hidden').length}개 — ${esc(k.desc)}</span></label></div>`).join('')}</div>
  <div style="margin-bottom:10px"><button data-a="leave">🚪 방 나가기</button></div>
  ${host ? `<button class="pri" data-a="start" ${S.players.length < 2 ? 'disabled' : ''}>게임 시작 (${S.players.length}/6)</button>` : '<div class="mut">방장이 시작하기를 기다리는 중...</div>'}<div class="mut" style="margin-top:14px">버전 ${VERSION}</div></div>`;
}
function gameHTML() {
  const me = S.players[S.me]; const myTurn = S.phase === 'turn' && S.cur === S.me;
  let status = '';
  if (S.phase === 'turn') status = `<b>${esc(S.players[S.cur].name)}</b>의 차례`;
  else if (S.phase === 'pick') status = '증강 선택 중';
  let h = `<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>🎲 ${esc(S.code)} · ${S.round}라운드${S.chaos ? ' · 🌀혼돈' : ''}${S.ranking ? ' · 🏅순위전' : ''}</b><span>${status} <button data-a="leave" style="padding:4px 10px;margin-left:8px">🚪 나가기</button></span></div>`;
  const banners = [];
  if (S.fog) banners.push(`🌫 안개 (${esc(S.players[S.fog.owner].name)}의 능력) - ${S.fog.owner === S.me ? '나는 전부 보입니다' : '내 말 근처만 보입니다'}`);
  if (S.echo) banners.push('🔁 메아리: 모든 플레이어가 차례를 두 번씩');
  if (S.interrupt) {
    const iw = S.players[S.interrupt.owner], ik = S.players[S.interrupt.killer];
    if (S.interrupt.owner === S.me) h += `<div class="banner" style="border-color:#ffb703">🫳 <b>소속 중지 발동!</b> ${esc(ik.name)}에게 말이 잡혔습니다(✝ 표시). 판 위의 내 말을 클릭하면 죽은 자리 쪽으로 2칸 이동합니다. <button data-a="skipint">사용 안 함</button></div>`;
    else banners.push(`🫳 ${esc(iw.name)}이(가) 소속 중지 능력을 선택하는 중...`);
  }
  if (banners.length) h += banners.map((b) => `<div class="banner">${b}</div>`).join('');
  if (S.phase === 'ended') {
    const w = S.players[S.winner];
    h += `<div class="card win">🏆 <b>${esc(w.name)}</b> 승리! <span class="mut">(${esc(S.reason)})</span>`;
    if (S.coWinners && S.coWinners.length) h += `<div class="mut">함께 승리: ${S.coWinners.map((i) => esc(S.players[i].name)).join(', ')}</div>`;
    if (S.final) h += `<ol class="final">${S.final.map((i) => `<li><span class="dot" style="background:${S.players[i].color}"></span>${esc(S.players[i].name)}${i === S.planWin ? ' 📋' : ''}</li>`).join('')}</ol>`;
    h += `<div style="margin-top:8px"><button class="pri" data-a="rematch">다시 하기</button></div></div>`;
  }
  h += `<div class="grid"><div>${boardSVG()}<div class="card" style="margin-top:10px"><b>${myTurn ? '내 차례' : '대기 중'}</b>${myTurn ? controlsHTML(me) : ''}</div></div>
  <div>${playerCards()}<div class="card"><div class="mut">진행 기록</div><div class="log" id="log">${S.log.map((l) => `<div>${esc(l)}</div>`).join('')}</div></div></div></div></div>`;
  if (S.phase === 'pick') h += pickModal();
  return h;
}
function render() {
  const app = $('app');
  if (!S) app.innerHTML = landingHTML();
  else if (S.phase === 'lobby') app.innerHTML = lobbyHTML();
  else app.innerHTML = gameHTML();
  document.body.classList.toggle('aiming', ui.mode === 'aim');
  if ($('log')) $('log').scrollTop = 1e9;
}

// ---- 이벤트 ----
const sendAbil = (extra) => { send(Object.assign({ t: 'ability', a: ui.abil }, extra)); resetUI(); };
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a; const v = el.dataset.v;
  const me = S && S.players[S.me];
  if (a === 'create' || a === 'join') {
    const name = $('nm').value.trim() || '플레이어'; localStorage.setItem('yut_name', name);
    if (a === 'join') { const code = $('cd').value.trim().toUpperCase(); if (code.length !== 4) return toast('4글자 방 코드를 입력하세요'); send({ t: 'join', code, name, token }); }
    else send({ t: 'create', name, token });
  } else if (a === 'start') send({ t: 'start' });
  else if (a === 'rematch') send({ t: 'rematch' });
  else if (a === 'pick') send({ t: 'pick', id: v });
  else if (a === 'sub') send({ t: 'sub', value: /^\d+$/.test(v) ? +v : v });
  else if (a === 'guess') send({ t: 'guess', value: +v });
  else if (a === 'vote') send({ t: 'vote', value: +v });
  else if (a === 'throw') send({ t: 'throw', choose: v || undefined });
  else if (a === 'coin') send({ t: 'throw', coin: true, choose: '도' });
  else if (a === 'ri') { ui.ri = +v; render(); }
  else if (a === 'cancel') { resetUI(); render(); }
  else if (a === 'tthome') sendAbil({ pid: ui.pid, target: 0 });
  else if (a === 'abil_t') sendAbil({ target: +v });
  else if (a === 'dir') sendAbil({ pid: ui.pid, dir: +v });
  else if (a === 'packview') { const nm = $('nm'), cd = $('cd'); try { if (nm) localStorage.setItem('yut_name', nm.value); } catch (e) { /* */ } packView = v; render(); window.scrollTo(0, 0); }
  else if (a === 'packback') { packView = null; render(); }
  else if (a === 'side') sendAbil({ side: v });
  else if (a === 'skipint') send({ t: 'interrupt', skip: true });
  else if (a === 'abil') {
    const d = ABIL[v];
    if (d.confirm && !confirm(d.confirm)) return;
    if (d.k === 'now') { send({ t: 'ability', a: v }); return; }
    if (d.k === 'yakji') { if (!me.st.lim.art) { if (confirm('예술! 이번 차례를 쓰고 예술작품을 완성합니다 (내 모든 말 이동 +2). 사용할까요?')) send({ t: 'ability', a: 'yakji' }); return; } ui.abil = 'yakji'; ui.mode = 'sel_side'; render(); return; }
    if (d.needThrow && S.tn.throws <= 0) return toast('던지기 기회가 있을 때만 사용할 수 있습니다');
    ui.abil = v; ui.pid = null;
    ui.mode = d.k === 'n' ? 'sel_n' : d.k === 'player' ? 'sel_player' : d.k === 'dead' ? 'sel_dead' : 'sel_p';
    render();
  } else if (a === 'piece') {
    if (S && S.interrupt && S.interrupt.owner === S.me) { if (me.pieces.some((x) => x.id === v)) send({ t: 'interrupt', pid: v }); else toast('판 위의 내 말을 클릭하세요'); return; }
    if (!S || S.phase !== 'turn' || S.cur !== S.me) return;
    if (ui.mode === 'sel_e') {
      if (me.pieces.some((x) => x.id === v)) return toast('상대의 말을 클릭하세요');
      return sendAbil({ pid: ui.pid, tpid: v });
    }
    if (!me.pieces.some((x) => x.id === v)) return; // 남의 말
    if (ui.mode === 'sel_p') {
      const k = ABIL[ui.abil].k;
      if (k === 'p') return sendAbil({ pid: v });
      ui.pid = v; ui.mode = k === 'pn' ? 'sel_n' : k === 'pe' ? 'sel_e' : k === 'fl' ? 'aim' : 'sel_d'; render(); return;
    }
    if (ui.mode) return;
    send({ t: 'move', ri: ui.ri, pid: v });
  } else if (a === 'node') {
    if (ui.mode === 'sel_n') sendAbil({ pid: ui.pid, node: +v, target: +v });
  }
});
document.addEventListener('change', (e) => {
  const d = e.target.dataset; if (!d) return;
  if (d.a === 'chaos') send({ t: 'chaos', v: e.target.checked });
  if (d.a === 'ranking') send({ t: 'ranking', v: e.target.checked });
  if (d.a === 'pack') {
    const ids = [...document.querySelectorAll('input[data-a="pack"]')].filter((x) => x.checked).map((x) => x.dataset.v);
    if (!ids.length) { toast('증강팩을 하나 이상 선택해야 합니다'); e.target.checked = true; return; }
    send({ t: 'packs', ids });
  }
});
connect(true);
render();
</script>
</body>
</html>
