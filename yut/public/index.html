<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증강 윷놀이</title>
<style>
:root{--bg:#14161c;--card:#1e222b;--card2:#272c38;--tx:#e8eaf0;--mut:#8b93a7;--ac:#ffb84d;--bd:#323848}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:15px}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);color:#1a1300;border-color:var(--ac);font-weight:700}
input[type=text]{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;width:100%}
h1{margin:0 0 4px;font-size:28px}
.wrap{max-width:1180px;margin:0 auto;padding:12px}
.center{max-width:420px;margin:8vh auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(300px,640px) 1fr;gap:12px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
svg{width:100%;height:auto;background:#222736;border-radius:12px;display:block}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--bd);font-size:12px;margin:2px 3px 2px 0;cursor:help}
.chip.used{opacity:.4;text-decoration:line-through}
.res{font-size:18px;font-weight:700;padding:8px 14px}
.res.sel{background:var(--ac);color:#1a1300;border-color:var(--ac)}
.cur{outline:2px solid var(--ac)}
.dead{opacity:.45}
.log{height:210px;overflow:auto;font-size:13px;line-height:1.55;color:#c8cddb}
.hint{background:#3a2f12;border:1px solid var(--ac);color:var(--ac);padding:8px 12px;border-radius:8px;margin:8px 0}
.overlay{position:fixed;inset:0;background:rgba(5,6,10,.82);display:flex;align-items:flex-start;justify-content:center;z-index:10;padding:12px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:900px;width:100%;margin:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.opt{text-align:left;padding:14px;background:var(--card2);border-radius:12px;border:2px solid var(--bd);cursor:pointer}
.opt:hover:not(.lock){border-color:var(--ac)}
.opt.lock{opacity:.35;cursor:not-allowed}
.opt b{font-size:17px;display:block;margin-bottom:6px}
.opt .d{font-size:13px;color:#c8cddb;line-height:1.45}
.tag{font-size:11px;color:var(--ac);margin-left:6px}
.augl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:45vh;overflow:auto;margin-top:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#552;border:1px solid var(--ac);padding:10px 18px;border-radius:10px;z-index:30;display:none}
.win{background:linear-gradient(90deg,#4a3500,#1e222b);border-color:var(--ac);font-size:18px}
.homebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hp{width:22px;height:22px;border-radius:50%;border:2px solid #000;display:inline-block;font-size:11px;text-align:center;line-height:18px;font-weight:700;color:#000}
.hp.me{cursor:pointer;box-shadow:0 0 0 2px var(--ac)}
.colorbtn{min-width:90px;font-weight:700;color:#111;border:2px solid #000}
.banner{background:#1d2a3a;border:1px solid #3d5a80;color:#bcd;padding:6px 10px;border-radius:8px;margin-bottom:8px;font-size:13px}
ol.final{margin:8px 0 0;padding-left:22px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RES = ['백도', '도', '개', '걸', '윷', '모'];
const COLORS = ['#e5484d', '#3e8ef7', '#30a46c', '#f5c518', '#a855f7', '#f97316'], COLOR_NAMES = ['빨강', '파랑', '초록', '노랑', '보라', '주황'];
const LET = { vanguard: '선', zealot: '광', marathon: '마', goblin: '깨', cannon: '포', pawn: '폰', kim: '김', queen: '후' };
let ws, meta = null, S = null, ui = { ri: 0, mode: null, abil: null, pid: null };
let token = localStorage.getItem('yut_token');
if (!token) { token = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('yut_token', token); }
const AUG = () => Object.fromEntries((meta ? meta.augments : []).map((a) => [a.id, a]));
const resetUI = () => { ui.mode = null; ui.abil = null; ui.pid = null; };

function connect(first) {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => {
    const room = localStorage.getItem('yut_room');
    if (first && room) ws.send(JSON.stringify({ t: 'join', code: room, name: localStorage.getItem('yut_name') || '', token }));
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'joined') { meta = m.meta; localStorage.setItem('yut_room', m.code); }
    else if (m.t === 'state') { const prevN = S ? S.logN : null; S = m.s; notifyNew(prevN); if (S.phase !== 'turn' || S.cur !== S.me) resetUI(); render(); }
    else if (m.t === 'left') { S = null; meta = null; resetUI(); localStorage.removeItem('yut_room'); render(); }
    else if (m.t === 'err') { toast(m.msg); if (!S) { localStorage.removeItem('yut_room'); render(); } }
  };
  ws.onclose = () => { if (S) toast('연결이 끊어졌습니다. 새로고침하면 다시 들어갑니다'); };
}
function notifyNew(prevN) {
  if (prevN == null || !S.logN || S.logN <= prevN) return;
  const fresh = S.log.slice(-(S.logN - prevN));
  const hit = fresh.find((l) => l.includes('이도류!'));
  if (hit) toast('⚔ ' + hit.replace(/^[^:]*: /, ''));
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
let tt; function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => { t.style.display = 'none'; }, 2800); }

// ---- 보드 좌표 ----
const C = [[90, 90], [90, 10], [10, 10], [10, 90]], MID = [50, 50];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
function nodeXY(n) {
  if (n < 20) { const s = Math.floor(n / 5), k = n % 5; return lerp(C[s], C[(s + 1) % 4], k / 5); }
  if (n === 22) return MID;
  if (n === 20 || n === 21) return lerp(C[1], MID, (n - 19) / 3);
  if (n === 23 || n === 24) return lerp(MID, C[3], (n - 22) / 3);
  if (n === 25 || n === 26) return lerp(C[2], MID, (n - 24) / 3);
  return lerp(MID, C[0], (n - 26) / 3);
}
const isBig = (n) => n === 0 || n === 5 || n === 10 || n === 15 || n === 22;

function boardSVG() {
  const me = S.players[S.me];
  let s = '<svg viewBox="0 0 100 100">';
  for (const line of meta.lines) s += `<polyline fill="none" stroke="#4a5368" stroke-width="1.1" points="${line.map((n) => nodeXY(n).join(',')).join(' ')}"/>`;
  const hi = new Set();
  if (ui.mode === 'sel_n') {
    if (ui.abil === 'timetravel') {
      const x = me.pieces.find((y) => y.id === ui.pid);
      if (x) { const r = meta.routes[x.route]; r.slice(0, r.indexOf(x.pos)).forEach((n) => hi.add(n)); }
    } else for (let n = 1; n <= 28; n++) hi.add(n);
  }
  for (let n = 0; n < 29; n++) {
    const [x, y] = nodeXY(n); const big = isBig(n);
    s += `<g data-a="node" data-v="${n}" style="cursor:${hi.has(n) ? 'pointer' : 'default'}"><circle cx="${x}" cy="${y}" r="${big ? 4.4 : 3}" fill="${n === 0 ? '#3a4157' : '#2d3446'}" stroke="${hi.has(n) ? '#ffb84d' : '#5a6580'}" stroke-width="${hi.has(n) ? 1.2 : 0.6}"/>`;
    if (n === 0) s += `<text x="${x}" y="${y + 1.2}" font-size="3" fill="#aab" text-anchor="middle">출발</text>`;
    s += '</g>';
  }
  S.poops.forEach((n) => { const [x, y] = nodeXY(n); s += `<text x="${x}" y="${y + 1.8}" font-size="5" text-anchor="middle" pointer-events="none">💩</text>`; });
  (S.party || []).forEach((q) => { const [x, y] = nodeXY(q.node); s += `<text x="${x - 3}" y="${y + 5}" font-size="4" pointer-events="none">${{ kill: '💀', back: '⏪', fwd: '🎁' }[q.kind]}</text>`; });
  if (Array.isArray(me.st.garlic)) me.st.garlic.filter((n) => !me.st.garlicGot.includes(n)).forEach((n) => { const [x, y] = nodeXY(n); s += `<text x="${x + 3}" y="${y - 2}" font-size="4" pointer-events="none">🧄</text>`; });
  if (Array.isArray(me.st.snipers)) me.st.snipers.forEach((n) => { const [x, y] = nodeXY(n); s += `<text x="${x - 3}" y="${y - 2}" font-size="4" pointer-events="none">🎯</text>`; });
  const byNode = {};
  S.players.forEach((p) => {
    const st = {};
    p.pieces.forEach((x) => { if (!x.done && x.pos > 0) (st[x.pos] = st[x.pos] || []).push(x); });
    Object.keys(st).forEach((n) => (byNode[n] = byNode[n] || []).push({ p, list: st[n] }));
  });
  Object.keys(byNode).forEach((n) => {
    const es = byNode[n]; const [cx, cy] = nodeXY(+n);
    es.forEach((e, i) => {
      const x = cx + (i - (es.length - 1) / 2) * 5.2, y = cy;
      const mine = e.p.idx === S.me; const lead = e.list[0];
      const frozen = e.list.some((q) => q.frozen), shield = e.list.some((q) => q.shield);
      const ty = e.list.find((q) => q.type !== 'normal');
      const letter = ty ? LET[ty.type] || '' : '';
      s += `<g data-a="piece" data-v="${lead.id}" style="cursor:pointer" opacity="${frozen ? 0.55 : 1}">
        <circle cx="${x}" cy="${y}" r="3.6" fill="${e.p.color}" stroke="${shield ? '#fff' : '#000'}" stroke-width="${shield ? 1 : 0.7}" ${shield ? 'stroke-dasharray="1.2 0.8"' : ''}/>
        ${e.list.length > 1 ? `<text x="${x}" y="${y + 1.3}" font-size="4" font-weight="700" fill="#000" text-anchor="middle">${e.list.length}</text>` : (letter ? `<text x="${x}" y="${y + 1.2}" font-size="3.2" font-weight="700" fill="#000" text-anchor="middle">${letter}</text>` : '')}
        ${frozen ? `<text x="${x + 2.6}" y="${y - 2.6}" font-size="3.6">❄</text>` : ''}</g>`;
    });
  });
  if (S.fog) s += '<rect x="0" y="0" width="100" height="100" fill="#99a" opacity="0.07" pointer-events="none"/>';
  s += '</svg>';
  return s;
}

// ---- 능력 정의 ----
// k: now(즉시) / p(내 말) / pn(말→칸) / n(칸) / pe(내 말→적 말) / pd(말→방향) / player(상대 선택) / dead(탈락자 선택)
const ABIL = {
  timetravel: { k: 'pn', hint: ['되돌릴 내 말을 클릭하세요', '돌아갈 칸을 클릭하세요'] },
  shield: { k: 'p', hint: ['보호막을 씌울 내 말뭉치를 클릭하세요'] },
  sacrifice: { k: 'p', hint: ['희생시킬 내 말을 클릭하세요'] },
  sniper: { k: 'n', needThrow: true, hint: ['저격할 칸을 클릭하세요 (던지기 기회 1회 소모)'] },
  baduk: { k: 'now' }, handfast: { k: 'now' }, chalice: { k: 'now' }, fog: { k: 'now' },
  lastdance: { k: 'now', confirm: '이번 턴이 끝나면 탈락합니다. 정말 사용할까요?' },
  truck: { k: 'p', pre: true, hint: ['달릴 말뭉치(말 2개 이상)를 클릭하세요'] },
  combo: { k: 'p', pre: true, hint: ['합체할 말뭉치(말 3개 이상)를 클릭하세요'] },
  flick: { k: 'pe', pre: true, hint: ['튕길 내 말을 클릭하세요', '맞힐 적 말을 클릭하세요'] },
  goblin: { k: 'pd', hint: ['도깨비를 클릭하세요', '방향을 고르세요'] },
  cannon: { k: 'pn', hint: ['포를 클릭하세요', '도착할 칸을 클릭하세요 (말이 있는 칸을 정확히 하나 넘어서)'] },
  domain: { k: 'p', hint: ['움직이지 못하게 할 내 말을 클릭하세요'] },
  aim: { k: 'player', hint: ['맞힐 플레이어를 고르세요'] },
  necro: { k: 'dead', hint: ['부활시킬 플레이어를 고르세요'] },
};
const REPEAT = { goblin: 'goblin', cannon: 'cannon' }; // 턴마다 쓰는 능력 (tn 플래그)

function abilHint() {
  const d = ABIL[ui.abil]; if (!d) return '';
  const step = ui.mode === 'sel_p' || ui.mode === 'sel_player' || ui.mode === 'sel_dead' ? 0 : 1;
  return d.hint[Math.min(step, d.hint.length - 1)];
}
function controlsHTML(me) {
  const tn = S.tn; let h = '';
  const A = AUG();
  if (tn.throws > 0) {
    h += `<div class="mut">던질 기회: ${tn.throws}회</div><div class="row" style="margin:6px 0">`;
    if (me.st.nextChoose) h += RES.map((r) => `<button class="pri" data-a="throw" data-v="${r}">${r}</button>`).join('') + '<span class="mut">원하는 결과를 고르세요</span>';
    else if (me.augs.includes('dogpig')) h += `<button class="pri" data-a="throw" data-v="도">도</button><button class="pri" data-a="throw" data-v="개">개</button>`;
    else h += `<button class="pri" data-a="throw" data-v="">🎲 윷 던지기</button>`;
    if (me.augs.includes('doberman') && me.st.coins >= 2) h += `<button data-a="coin" data-v="">🐶 개 코인 2개 → 모 (${me.st.coins})</button>`;
    h += '</div>';
  }
  if (tn.queue.length) {
    if (ui.ri >= tn.queue.length) ui.ri = 0;
    h += `<div class="mut">사용할 결과를 고르고 → 말을 클릭</div><div class="row" style="margin:6px 0">` +
      tn.queue.map((r, i) => `<button class="res ${i === ui.ri ? 'sel' : ''}" data-a="ri" data-v="${i}">${r}</button>`).join('') + '</div>';
    if (tn.throws > 0) h += '<div class="mut">※ 던질 기회를 모두 쓴 뒤에 말을 움직일 수 있습니다</div>';
  }
  const ab = me.augs.filter((id) => ABIL[id]);
  if (ab.length) {
    h += '<div class="row" style="margin-top:8px">' + ab.map((id) => {
      const d = ABIL[id];
      let off = !!me.used[id];
      if (REPEAT[id] && tn[REPEAT[id]]) off = true;
      if (d.pre && tn.thrown) off = true;
      return `<button data-a="abil" data-v="${id}" ${off ? 'disabled' : ''} title="${esc(A[id].desc)}">⚡ ${esc(A[id].name)}</button>`;
    }).join('') + '</div>';
  }
  if (ui.mode) {
    const others = S.players.filter((p) => p.alive && !p.out && p.idx !== S.me);
    let extra = '';
    if (ui.mode === 'sel_player') extra = others.map((p) => `<button data-a="abil_t" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('');
    if (ui.mode === 'sel_dead') extra = S.players.filter((p) => !p.alive).map((p) => `<button data-a="abil_t" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('') || '<span class="mut">탈락한 플레이어가 없습니다</span>';
    if (ui.mode === 'sel_d') extra = '<button data-a="dir" data-v="1">도 (앞으로 1칸)</button><button data-a="dir" data-v="-1">백도 (뒤로 1칸)</button>';
    if (ui.abil === 'timetravel' && ui.mode === 'sel_n') extra = '<button data-a="tthome">대기칸으로</button>';
    h += `<div class="hint">${abilHint()} <button data-a="cancel">취소</button> ${extra}</div>`;
  }
  return h;
}

function playerCards() {
  const A = AUG();
  return S.players.map((p) => {
    const home = p.pieces.filter((x) => !x.done && x.pos === 0);
    const badges = [];
    if (p.st.coins) badges.push(`🐶${p.st.coins}`);
    if (p.augs.includes('summon')) badges.push(`🔮${p.st.ritual}/12`);
    if (p.augs.includes('garlic')) badges.push(`🧄${p.st.garlicGot.length}/3`);
    if (p.augs.includes('coup')) badges.push(`⚔${p.st.kills}/4`);
    if (p.augs.includes('cow')) badges.push(`🐂${p.st.backdoCaps}/2`);
    if (p.augs.includes('score')) badges.push(`🎼${p.st.seen.length}/6`);
    if (p.augs.includes('nofriend')) badges.push(`🥲${p.st.friendHits.length}/${S.players.filter((q) => q.alive).length - 1}`);
    if (p.augs.includes('queen')) badges.push(`👑목숨+${p.st.queenLives} · 던짐 ${p.st.queenThrows}/12`);
    if (p.augs.includes('kim') && p.st.kimLeft > 0) badges.push(`🎎${p.st.kimLeft}차례 남음`);
    if (p.st.domain) badges.push(`🌀영역 ${p.st.domain.left}`);
    if (p.hp != null) badges.push(`❤${p.hp}`);
    if (p.st.skip) badges.push(`⏭${p.st.skip}`);
    if (p.st.leechTo != null) badges.push(`🪱${esc(S.players[p.st.leechTo].name)}와 운명공동체`);
    if (p.st.poison) badges.push('☠독');
    if (p.st.lastDance) badges.push('💃라스트댄스');
    if (p.st.nextChoose) badges.push('✋다음 윷 자유');
    if (p.st.plan === true || Array.isArray(p.st.plan)) badges.push('📋순위 예측함');
    S.duels.forEach((d) => { if (d.t === p.idx) badges.push(`⚔승부 ${d.left}차례 안에 완주!`); });
    const rk = S.ranks.indexOf(p.idx);
    let status = '';
    if (!p.alive) status = ' · 탈락'; else if (p.fixedRank) status = ` · 🥉${p.fixedRank}위 확정`; else if (rk >= 0) status = ` · 🏅${rk + 1}위 확정`;
    return `<div class="card ${S.phase === 'turn' && S.cur === p.idx ? 'cur' : ''} ${p.alive && !p.out ? '' : 'dead'}" style="margin-bottom:8px;padding:10px">
      <div class="row"><b><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.idx === S.me ? ' (나)' : ''}</b>
      <span class="mut">완주 ${p.finished}/${p.npieces} · 윷 ${p.sticks}개${p.connected ? '' : ' · 접속 끊김'}${status}</span></div>
      <div class="homebox" style="margin:6px 0"><span class="mut">대기</span>${home.map((x) => `<span class="hp ${p.idx === S.me ? 'me' : ''}" style="background:${p.color}" ${p.idx === S.me ? `data-a="piece" data-v="${x.id}"` : ''}>${LET[x.type] || ''}</span>`).join('') || '<span class="mut">-</span>'}</div>
      <div>${p.augs.map((id) => `<span class="chip ${p.used[id] ? 'used' : ''}" title="${esc(A[id].desc)}">${esc(A[id].name)}</span>`).join('') || '<span class="mut">증강 없음</span>'}</div>
      ${badges.length ? `<div class="mut">${badges.join(' · ')}</div>` : ''}</div>`;
  }).join('');
}

function pickModal() {
  const pk = S.pick; const A = AUG(); const pickerP = S.players[pk.picker]; const sub = pk.sub;
  const kindName = { start: '시작', mid: '중간', end: '마무리' }[pk.kind];
  let h = `<div class="overlay"><div class="modal"><h2 style="margin:0">${S.round}라운드 증강 선택 <span class="tag">${kindName} 전용 등장</span></h2>`;
  h += `<div class="mut">${S.ganTaek ? '🐱 간택 발동 중: 고양이가 나오면 반드시 골라야 합니다 · ' : ''}${S.ranking ? '순위전 · ' : ''}남은 선택 ${pk.left[pk.picker] || 0}회</div>`;
  const others = S.players.filter((p) => p.alive && !p.out && p.idx !== S.me);
  if (sub && sub.type === 'guess') {
    h += `<h3>❓ 나 누구게?</h3><p>모든 정보가 감춰졌습니다. <b>내 말 색</b>을 맞춰보세요! 틀리면 다음 차례를 건너뜁니다.</p>`;
    if (sub.pending.includes(S.me)) h += '<div class="row">' + COLORS.map((c, i) => `<button class="colorbtn" style="background:${c}" data-a="guess" data-v="${i}">${COLOR_NAMES[i]}</button>`).join('') + '</div>';
    else h += `<p class="mut">${S.me === pk.picker && !sub.pending.length ? '' : '다른 플레이어가 고르는 중...'} (남은 사람: ${sub.pending.map((i) => esc(S.players[i].name)).join(', ') || '없음'})</p>`;
  } else if (sub && sub.type === 'vote') {
    h += `<h3>🗳 내려!</h3><p>차례를 한 번 건너뛰게 할 사람에게 투표하세요. (${esc(pickerP.name)}님은 2표)</p>`;
    if (sub.pending.includes(S.me)) h += '<div class="row">' + others.map((p) => `<button data-a="vote" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('') + '</div>';
    else h += `<p class="mut">투표 완료. 기다리는 중... (남은 사람: ${sub.pending.map((i) => esc(S.players[i].name)).join(', ') || '없음'})</p>`;
  } else if (pk.picker !== S.me) {
    h += `<p style="font-size:17px">⏳ <b>${esc(pickerP.name)}</b> 님이 고르는 중...</p>`;
    h += `<div class="mut">현재 증강 선택 순서: ${Object.keys(pk.left).map((i) => esc(S.players[i].name)).join(' → ')}</div>`;
  } else if (sub) {
    if (sub.type === 'player') {
      h += `<p>${esc(A[sub.aug].name)}: 대상 플레이어를 고르세요</p><div class="row">` +
        others.map((p) => `<button data-a="sub" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('') + '</div>';
    } else if (sub.type === 'augment') {
      h += `<p>${esc(A[sub.aug].name)}: 증강을 하나 고르세요</p><div class="augl">` +
        meta.augments.filter((a) => a.cat !== 'hidden').map((a) => `<button data-a="sub" data-v="${a.id}" title="${esc(a.desc)}" style="text-align:left">${esc(a.name)}<span class="tag">${{ gen: '범용', start: '시작', mid: '중간', end: '마무리' }[a.cat]}</span></button>`).join('') + '</div>';
    } else if (sub.type === 'owned') {
      h += `<p>${esc(S.players[sub.target].name)}의 증강 중 고양이로 바꿀 것을 고르세요 (3라운드 동안)</p><div class="augl">` +
        sub.list.map((id) => `<button data-a="sub" data-v="${id}" title="${esc(A[id].desc)}" style="text-align:left">${esc(A[id].name)}</button>`).join('') + '</div>';
    } else if (sub.type === 'fold') {
      h += `<p>🧻 게임 접어라: 접는 방향을 고르세요. 접히는 쪽의 말은 반대편 칸으로 옮겨가며, 그 칸에 있던 적을 잡습니다.</p><div class="row">
        <button data-a="sub" data-v="R">→ 오른쪽을 왼쪽으로</button><button data-a="sub" data-v="L">← 왼쪽을 오른쪽으로</button>
        <button data-a="sub" data-v="T">↓ 위쪽을 아래로</button><button data-a="sub" data-v="B">↑ 아래쪽을 위로</button></div>`;
    } else if (sub.type === 'spin') {
      h += `<p>🎡 돌림판 결과: 시계 반대 방향으로 <b>${sub.k * 90}°</b> 회전 (말이 ${sub.k * 5}칸씩 이동합니다)</p><div class="row"><button class="pri" data-a="sub" data-v="keep">이대로 확정</button>${sub.respun ? '<span class="mut">(이미 한 번 다시 돌림)</span>' : '<button data-a="sub" data-v="respin">🔄 다시 돌리기 (1회)</button>'}</div>`;
    } else if (sub.type === 'rank') {
      h += `<p>📋 계획대로: 최종 순위를 1위부터 차례로 예측하세요.</p><div class="mut">지금까지: ${sub.picks.map((i, k) => `${k + 1}위 ${esc(S.players[i].name)}`).join(' / ') || '-'}</div><div class="row" style="margin-top:8px">` +
        S.players.filter((p) => !sub.picks.includes(p.idx)).map((p) => `<button data-a="sub" data-v="${p.idx}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)} → ${sub.picks.length + 1}위</button>`).join('') + '</div>';
    }
  } else {
    h += '<div class="opts">' + pk.options.map((o) => { const a = A[o.id]; return `<div class="opt ${o.locked ? 'lock' : ''}" ${o.locked ? '' : `data-a="pick" data-v="${o.id}"`}><b>${esc(a.name)}<span class="tag">${{ gen: '범용', start: '시작 전용', mid: '중간 전용', end: '마무리 전용' }[a.cat]}</span></b><div class="d">${esc(a.desc)}</div></div>`; }).join('') + '</div>';
  }
  if (pk.banned.length) h += `<div class="mut" style="margin-top:10px">🔍 이번 선택에서 무효화됨: ${pk.banned.map((id) => esc(A[id].name)).join(', ')}</div>`;
  h += '<div style="margin-top:12px">' + playerCards() + '</div></div></div>';
  return h;
}

function landingHTML() {
  return `<div class="center"><h1>🎲 증강 윷놀이</h1><p class="mut">최대 6인 · 라운드 1/5/10에 증강 선택</p>
  <div class="card"><div class="mut">이름</div><input type="text" id="nm" maxlength="10" value="${esc(localStorage.getItem('yut_name') || '')}" placeholder="이름">
  <div class="row" style="margin-top:12px"><button class="pri" data-a="create">새 방 만들기</button></div>
  <hr style="border-color:#323848;margin:16px 0"><div class="mut">친구가 알려준 방 코드</div>
  <div class="row"><input type="text" id="cd" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;width:120px"><button data-a="join">입장</button></div></div></div>`;
}
function lobbyHTML() {
  const host = S.me === 0;
  return `<div class="center"><h1>방 코드: ${esc(S.code)}</h1><p class="mut">친구에게 이 코드를 알려주세요 (같은 서버 주소로 접속)</p>
  <div class="card">${S.players.map((p) => `<div><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.idx === 0 ? ' 👑' : ''}${p.idx === S.me ? ' (나)' : ''}</div>`).join('')}</div>
  <div class="card"><label><input type="checkbox" data-a="chaos" ${S.chaos ? 'checked' : ''} ${host ? '' : 'disabled'}> 🌀 혼돈 모드 (증강을 한 번에 2번 고름)</label>
  <div style="height:8px"></div>
  <label><input type="checkbox" data-a="ranking" ${S.ranking ? 'checked' : ''} ${host ? '' : 'disabled'}> 🏅 순위전 (한 명이 이겨도 끝나지 않고 순위를 끝까지 가림 · 계획대로/동메달/취~소 증강 등장)</label></div>
  <div style="margin-bottom:10px"><button data-a="leave">🚪 방 나가기</button></div>
  ${host ? `<button class="pri" data-a="start" ${S.players.length < 2 ? 'disabled' : ''}>게임 시작 (${S.players.length}/6)</button>` : '<div class="mut">방장이 시작하기를 기다리는 중...</div>'}</div>`;
}
function gameHTML() {
  const me = S.players[S.me]; const myTurn = S.phase === 'turn' && S.cur === S.me;
  let status = '';
  if (S.phase === 'turn') status = `<b>${esc(S.players[S.cur].name)}</b>의 차례`;
  else if (S.phase === 'pick') status = '증강 선택 중';
  let h = `<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>🎲 ${esc(S.code)} · ${S.round}라운드${S.chaos ? ' · 🌀혼돈' : ''}${S.ranking ? ' · 🏅순위전' : ''}</b><span>${status} <button data-a="leave" style="padding:4px 10px;margin-left:8px">🚪 나가기</button></span></div>`;
  const banners = [];
  if (S.fog) banners.push(`🌫 안개 (${esc(S.players[S.fog.owner].name)}의 능력) - ${S.fog.owner === S.me ? '나는 전부 보입니다' : '내 말 근처만 보입니다'}`);
  if (S.echo) banners.push('🔁 메아리: 모든 플레이어가 차례를 두 번씩');
  if (banners.length) h += banners.map((b) => `<div class="banner">${b}</div>`).join('');
  if (S.phase === 'ended') {
    const w = S.players[S.winner];
    h += `<div class="card win">🏆 <b>${esc(w.name)}</b> 승리! <span class="mut">(${esc(S.reason)})</span>`;
    if (S.coWinners && S.coWinners.length) h += `<div class="mut">함께 승리: ${S.coWinners.map((i) => esc(S.players[i].name)).join(', ')}</div>`;
    if (S.final) h += `<ol class="final">${S.final.map((i) => `<li><span class="dot" style="background:${S.players[i].color}"></span>${esc(S.players[i].name)}${i === S.planWin ? ' 📋' : ''}</li>`).join('')}</ol>`;
    h += `<div style="margin-top:8px"><button class="pri" data-a="rematch">다시 하기</button></div></div>`;
  }
  h += `<div class="grid"><div>${boardSVG()}<div class="card" style="margin-top:10px"><b>${myTurn ? '내 차례' : '대기 중'}</b>${myTurn ? controlsHTML(me) : ''}</div></div>
  <div>${playerCards()}<div class="card"><div class="mut">진행 기록</div><div class="log" id="log">${S.log.map((l) => `<div>${esc(l)}</div>`).join('')}</div></div></div></div></div>`;
  if (S.phase === 'pick') h += pickModal();
  return h;
}
function render() {
  const app = $('app');
  if (!S) app.innerHTML = landingHTML();
  else if (S.phase === 'lobby') app.innerHTML = lobbyHTML();
  else app.innerHTML = gameHTML();
  if ($('log')) $('log').scrollTop = 1e9;
}

// ---- 이벤트 ----
const sendAbil = (extra) => { send(Object.assign({ t: 'ability', a: ui.abil }, extra)); resetUI(); };
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a; const v = el.dataset.v;
  const me = S && S.players[S.me];
  if (a === 'create' || a === 'join') {
    const name = $('nm').value.trim() || '플레이어'; localStorage.setItem('yut_name', name);
    if (a === 'join') { const code = $('cd').value.trim().toUpperCase(); if (code.length !== 4) return toast('4글자 방 코드를 입력하세요'); send({ t: 'join', code, name, token }); }
    else send({ t: 'create', name, token });
  } else if (a === 'start') send({ t: 'start' });
  else if (a === 'rematch') send({ t: 'rematch' });
  else if (a === 'pick') send({ t: 'pick', id: v });
  else if (a === 'sub') send({ t: 'sub', value: /^\d+$/.test(v) ? +v : v });
  else if (a === 'guess') send({ t: 'guess', value: +v });
  else if (a === 'vote') send({ t: 'vote', value: +v });
  else if (a === 'throw') send({ t: 'throw', choose: v || undefined });
  else if (a === 'coin') send({ t: 'throw', coin: true, choose: '도' });
  else if (a === 'ri') { ui.ri = +v; render(); }
  else if (a === 'cancel') { resetUI(); render(); }
  else if (a === 'tthome') sendAbil({ pid: ui.pid, target: 0 });
  else if (a === 'abil_t') sendAbil({ target: +v });
  else if (a === 'dir') sendAbil({ pid: ui.pid, dir: +v });
  else if (a === 'abil') {
    const d = ABIL[v];
    if (d.confirm && !confirm(d.confirm)) return;
    if (d.k === 'now') { send({ t: 'ability', a: v }); return; }
    if (d.needThrow && S.tn.throws <= 0) return toast('던지기 기회가 있을 때만 사용할 수 있습니다');
    ui.abil = v; ui.pid = null;
    ui.mode = d.k === 'n' ? 'sel_n' : d.k === 'player' ? 'sel_player' : d.k === 'dead' ? 'sel_dead' : 'sel_p';
    render();
  } else if (a === 'piece') {
    if (!S || S.phase !== 'turn' || S.cur !== S.me) return;
    if (ui.mode === 'sel_e') {
      if (me.pieces.some((x) => x.id === v)) return toast('상대의 말을 클릭하세요');
      return sendAbil({ pid: ui.pid, tpid: v });
    }
    if (!me.pieces.some((x) => x.id === v)) return; // 남의 말
    if (ui.mode === 'sel_p') {
      const k = ABIL[ui.abil].k;
      if (k === 'p') return sendAbil({ pid: v });
      ui.pid = v; ui.mode = k === 'pn' ? 'sel_n' : k === 'pe' ? 'sel_e' : 'sel_d'; render(); return;
    }
    if (ui.mode) return;
    send({ t: 'move', ri: ui.ri, pid: v });
  } else if (a === 'node') {
    if (ui.mode === 'sel_n') sendAbil({ pid: ui.pid, node: +v, target: +v });
  }
});
document.addEventListener('change', (e) => {
  const d = e.target.dataset; if (!d) return;
  if (d.a === 'chaos') send({ t: 'chaos', v: e.target.checked });
  if (d.a === 'ranking') send({ t: 'ranking', v: e.target.checked });
});
connect(true);
render();
</script>
</body>
</html>
